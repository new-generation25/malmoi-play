<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>말모이 작전 — 덕이 &amp; 아란 DM</title>
<style>
  :root{ --u: 8px; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:#000; overflow:hidden; }
  body{
    display:flex; align-items:center; justify-content:center;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    cursor:pointer; user-select:none;
  }

  /* ── 4:3 메시지 화면 ── */
  #frame{
    position:relative;
    width:min(100vw, 133.3333vh);
    aspect-ratio:4/3;
    background:#141416;
    overflow:hidden;
    display:flex; flex-direction:column;
    transition:transform .45s ease, filter .45s ease;
  }
  #frame.closing{ transform:scale(.94); filter:brightness(.15) blur(2px); }

  /* ── 상단 헤더 ── */
  #head{
    flex:0 0 auto;
    display:flex; align-items:center; gap:calc(var(--u)*1.6);
    padding:calc(var(--u)*1.5) calc(var(--u)*2.2);
    background:#1d1d20;
    border-bottom:1px solid #2c2c31;
  }
  #back{ font-size:calc(var(--u)*3); color:#8b8b93; line-height:1; }
  #avatar{
    width:calc(var(--u)*4.6); height:calc(var(--u)*4.6); border-radius:35%;
    background:linear-gradient(145deg,#ffd54a,#ff9f43);
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--u)*2.6);
  }
  #who{ display:flex; flex-direction:column; gap:calc(var(--u)*.25); }
  #who b{ font-size:calc(var(--u)*2.5); color:#f2f2f5; font-weight:700; letter-spacing:-.02em; }
  #who span{ font-size:calc(var(--u)*1.4); color:#7c7c85; }
  #sig{ margin-left:auto; display:flex; align-items:center; gap:calc(var(--u)*1.2);
        font-size:calc(var(--u)*1.5); color:#7c7c85; letter-spacing:.02em; }

  /* ── 대화 영역 ── */
  #thread{
    flex:1 1 auto; overflow:hidden;
    padding:calc(var(--u)*2) calc(var(--u)*2.4) calc(var(--u)*1);
    display:flex; flex-direction:column; justify-content:flex-end;
    gap:calc(var(--u)*1.5);
  }
  .row{ display:flex; align-items:flex-end; gap:calc(var(--u)*1); max-width:100%;
        animation:pop .28s cubic-bezier(.2,1.3,.4,1) both; }
  .row.me{ justify-content:flex-end; }
  @keyframes pop{ from{ opacity:0; transform:translateY(calc(var(--u)*1.4)) scale(.96);} to{opacity:1;transform:none;} }

  .bubble{
    max-width:72%;
    padding:calc(var(--u)*1.5) calc(var(--u)*2);
    font-size:calc(var(--u)*2.55);
    line-height:1.42; letter-spacing:-.015em;
    word-break:break-word; white-space:pre-wrap;
  }
  .you .bubble{ background:#33333a; color:#f4f4f7; border-radius:calc(var(--u)*2.2); border-top-left-radius:calc(var(--u)*.5); }
  .me  .bubble{ background:#ffe300; color:#17171a; font-weight:600; border-radius:calc(var(--u)*2.2); border-top-right-radius:calc(var(--u)*.5); }

  .meta{ display:flex; flex-direction:column; align-items:flex-end; gap:calc(var(--u)*.2);
         font-size:calc(var(--u)*1.3); color:#6e6e77; padding-bottom:calc(var(--u)*.3); flex:0 0 auto; }
  .you .meta{ align-items:flex-start; }
  .unread{ color:#ffe300; font-weight:700; font-size:calc(var(--u)*1.45); }

  .caret{ display:inline-block; width:calc(var(--u)*.28); height:calc(var(--u)*2.5);
          background:currentColor; vertical-align:-.32em; margin-left:calc(var(--u)*.3);
          animation:blink .9s steps(1,end) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  /* 아란 입력중 표시 */
  .dots{ display:flex; gap:calc(var(--u)*.7); padding:calc(var(--u)*1.9) calc(var(--u)*2.2);
         background:#33333a; border-radius:calc(var(--u)*2.2); border-top-left-radius:calc(var(--u)*.5); }
  .dots i{ width:calc(var(--u)*.9); height:calc(var(--u)*.9); border-radius:50%; background:#8e8e98;
           animation:bob 1.1s infinite ease-in-out; }
  .dots i:nth-child(2){ animation-delay:.16s; } .dots i:nth-child(3){ animation-delay:.32s; }
  @keyframes bob{ 0%,60%,100%{ transform:translateY(0); opacity:.45;} 30%{ transform:translateY(calc(var(--u)*-.7)); opacity:1;} }

  /* ── 입력창 (덕이가 무대에서 치는 자리) ── */
  #bar{
    flex:0 0 auto;
    display:flex; align-items:center; gap:calc(var(--u)*1.4);
    padding:calc(var(--u)*1.6) calc(var(--u)*2.2) calc(var(--u)*2);
    background:#1d1d20; border-top:1px solid #2c2c31;
  }
  #plus{ font-size:calc(var(--u)*3.2); color:#8b8b93; line-height:1; }
  #input{
    flex:1 1 auto; min-height:calc(var(--u)*5.4);
    display:flex; align-items:center;
    padding:calc(var(--u)*1) calc(var(--u)*1.8);
    background:#2a2a2f; border-radius:calc(var(--u)*2.7);
    font-size:calc(var(--u)*2.4); color:#f4f4f7; letter-spacing:-.015em;
    white-space:pre-wrap; word-break:break-word;
  }
  #input.empty::before{ content:"메시지 입력"; color:#66666e; }
  #send{
    width:calc(var(--u)*5.2); height:calc(var(--u)*5.2); border-radius:50%;
    background:#3a3a41; color:#7c7c85;
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--u)*2.4); transition:background .2s, color .2s, transform .15s;
  }
  #send.on{ background:#ffe300; color:#17171a; transform:scale(1.06); }

  /* ── 시작 / 종료 오버레이 ── */
  .veil{
    position:absolute; inset:0; background:#000;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:calc(var(--u)*2); color:#f4f4f7; text-align:center;
    transition:opacity .5s ease; z-index:5;
  }
  .veil.hide{ opacity:0; pointer-events:none; }
  .veil b{ font-size:calc(var(--u)*3.4); font-weight:700; letter-spacing:-.02em; }
  .veil span{ font-size:calc(var(--u)*1.9); color:#8b8b93; line-height:1.7; }
  #endveil{ opacity:0; pointer-events:none; }
  #endveil.show{ opacity:1; }

  /* ── 진행자용 힌트 (관객석에서 안 보이게 화면 밖) ── */
  #hint{
    position:fixed; left:0; right:0; bottom:0; z-index:9;
    background:rgba(0,0,0,.88); color:#c9c9d1;
    font-size:14px; padding:8px 14px; line-height:1.6;
    border-top:1px solid #2c2c31;
    display:flex; gap:18px; align-items:center; flex-wrap:wrap;
  }
  #hint.off{ display:none; }
  #hint b{ color:#ffe300; }
  #hint .k{ color:#6e6e77; }
</style>
</head>
<body>

<div id="frame">
  <div id="head">
    <div id="back">‹</div>
    <div id="avatar">🐣</div>
    <div id="who"><b>아란</b><span>접속중</span></div>
    <div id="sig">📶 🔋 3:41</div>
  </div>

  <div id="thread"></div>

  <div id="bar">
    <div id="plus">＋</div>
    <div id="input" class="empty"></div>
    <div id="send">➤</div>
  </div>

  <div class="veil" id="startveil">
    <b>덕이 ↔ 아란</b>
    <span>화면을 클릭하면 시작합니다 &nbsp;·&nbsp; 🔊 소리 켜짐</span>
  </div>
  <div class="veil" id="endveil"></div>
</div>

<div id="hint" class="off"></div>

<script>
(function(){
  "use strict";

  /* ─────────── 대사 ─────────── */
  var LINES = [
    { s:"me",  t:"야 지금 몇 시임? 레알 안 옴? 너 읽씹하면 진짜 뒤진다;;" },
    { s:"you", t:"ㄷㄷㄷ 개무섭네;; 나 오늘 늦잠 이슈 심각함ㅠ ㅈㅅㅈㅅ!" },
    { s:"me",  t:"아 진짜 개킹받네; 약속 파토 내는 거 한두 번이냐?" },
    { s:"you", t:"나 어제 코르티스 컴백 영상 보느라 밤샜단 말임ㅠㅠ 억까 ㄴㄴ" },
    { s:"me",  t:"알 바노? 핑계 대지 말고 빨리 튀어오셈." },
    { s:"you", t:"ㅇㅋㅇㅋ 미안. 대신 오늘 불닭에 삼김 쏜다! 딜?" },
    { s:"me",  t:"오 레알? 딜! 일단 빨리 오기나 하셈." }
  ];
  var CLOSING = "(폰을 닫으며 신나서) 야르! 엄마가 밥 사 먹으라고 준 카드는 굳었네? 그럼 이건 다 내 용돈 각? 개꿀~! 기다리는 동안 챌린지 춤이나 따야지.";

  var frame=document.getElementById("frame"),
      thread=document.getElementById("thread"),
      input=document.getElementById("input"),
      sendBtn=document.getElementById("send"),
      startVeil=document.getElementById("startveil"),
      endVeil=document.getElementById("endveil"),
      hint=document.getElementById("hint");

  var idx=-1, busy=false, pending=null, started=false, ended=false;
  var SPEED=62;                     // 덕이 타이핑 — 글자당 ms
  var WAIT_YOU=900;                 // 아란 «입력 중» 표시 시간(ms) — 클릭하면 바로 도착
  var clock=[41,42,43,44,45,46,47]; // 말풍선 시각 (3:xx)

  /* ─────────── 단위(글자 크기) ─────────── */
  function fit(){ document.documentElement.style.setProperty("--u",(frame.clientWidth/100)+"px"); }
  addEventListener("resize",fit); fit();

  /* ─────────── 소리 (합성 · 외부파일 없음) ─────────── */
  var ac=null, master=null, noise=null, VOL=1.0, audioOK=false;
  function audio(){
    if(ac){ if(ac.state==="suspended") ac.resume(); return ac; }
    try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    master=ac.createGain(); master.gain.value=VOL; master.connect(ac.destination);
    var n=Math.floor(ac.sampleRate*.2), b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
    noise=b;
    if(ac.state==="suspended") ac.resume();
    audioOK=true;
    return ac;
  }
  function setVol(v){ VOL=Math.max(0,Math.min(2,v)); if(master) master.gain.value=VOL; showHint(); }

  // 갤럭시 타건음: 짧은 노이즈 틱 + 낮은 바디 (덕이/아란 음색 구분)
  function key(who){
    var c=audio(); if(!c) return;
    var t=c.currentTime, hi=(who==="me")?2800:2100, lo=(who==="me")?540:400;
    var src=c.createBufferSource(); src.buffer=noise;
    src.playbackRate.value=0.9+Math.random()*0.25;
    var bp=c.createBiquadFilter(); bp.type="bandpass";
    bp.frequency.value=hi*(0.88+Math.random()*0.24); bp.Q.value=1.2;
    var g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.34,t+0.002);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.038);
    src.connect(bp); bp.connect(g); g.connect(master); src.start(t); src.stop(t+0.06);

    var o=c.createOscillator(), og=c.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(lo*(0.93+Math.random()*0.14),t);
    og.gain.setValueAtTime(0.0001,t);
    og.gain.exponentialRampToValueAtTime(0.20,t+0.003);
    og.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    o.connect(og); og.connect(master); o.start(t); o.stop(t+0.07);
  }
  // 단순 톤 (f1→f2)
  function tone(f1,f2,dur,vol,type,delay){
    var c=audio(); if(!c) return; var t=c.currentTime+(delay||0);
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine";
    o.frequency.setValueAtTime(f1,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.03);
  }
  function sndSend(){                 // 전송 «휙»
    tone(560,1500,.16,.30,"sine");
    tone(1200,2400,.09,.10,"triangle",.01);
  }
  function sndRecv(){                 // 수신 «딩-동»
    tone(1180,1180,.10,.28,"sine");
    tone(880,880,.16,.26,"sine",.10);
  }
  function sndClose(){                // 폰 닫기
    tone(420,150,.32,.30,"sine");
    tone(180,70,.40,.18,"triangle",.02);
  }

  /* ─────────── 화면 그리기 ─────────── */
  function stamp(i){ return "오후 3:"+clock[Math.min(i,clock.length-1)]; }

  function makeRow(line,i,text){
    var row=document.createElement("div");
    row.className="row "+line.s;
    var b=document.createElement("div"); b.className="bubble"; b.textContent=text||"";
    var m=document.createElement("div"); m.className="meta";
    if(line.s==="me"){ m.innerHTML='<em class="unread">1</em><span>'+stamp(i)+'</span>'; }
    else{ m.innerHTML='<span>'+stamp(i)+'</span>'; }
    if(line.s==="me"){ row.appendChild(m); row.appendChild(b); }
    else{ row.appendChild(b); row.appendChild(m); }
    thread.appendChild(row);
    trim();
    return b;
  }
  // 4:3 화면을 넘치지 않게 위로 밀려난 말풍선만 덜어냄
  function trim(){
    var guard=0;
    if(!thread.clientHeight) return;   // 아직 레이아웃 전(높이 0)이면 건드리지 않음
    while(thread.children.length>1 && guard++<20){
      var top=thread.getBoundingClientRect().top;
      var first=thread.firstElementChild.getBoundingClientRect();
      if(first.bottom<=top+1 || first.top<top-1) thread.removeChild(thread.firstElementChild);
      else break;
    }
  }
  function clearUnread(){
    var u=thread.querySelectorAll(".unread");
    for(var i=0;i<u.length;i++) u[i].textContent="";
  }
  function setInput(t){
    if(t){ input.classList.remove("empty"); input.innerHTML=""; input.appendChild(document.createTextNode(t));
           var c=document.createElement("i"); c.className="caret"; input.appendChild(c);
           sendBtn.classList.add("on"); }
    else { input.classList.add("empty"); input.textContent=""; sendBtn.classList.remove("on"); }
  }

  /* ─────────── 타이핑 ─────────── */
  function type(text, who, put, done){
    var i=0, timer=null, hold=null;
    function finish(){
      if(timer){ clearInterval(timer); timer=null; }
      if(hold){ clearTimeout(hold); hold=null; }
      put(text); pending=null; done();
    }
    pending=finish;
    timer=setInterval(function(){
      i++;
      put(text.slice(0,i));
      var ch=text.charAt(i-1);
      if(ch!==" ") key(who);
      if(i>=text.length){
        clearInterval(timer); timer=null;
        hold=setTimeout(function(){ hold=null; pending=null; done(); }, 400);
        pending=function(){ clearTimeout(hold); hold=null; pending=null; done(); };
      }
    }, SPEED);
  }

  /* 소리 없이 «입력 중»만 띄우고 기다리는 구간(아란) */
  function wait(ms, done){
    var t=setTimeout(function(){ t=null; pending=null; done(); }, ms);
    pending=function(){ if(t) clearTimeout(t); t=null; pending=null; done(); };
  }

  /* ─────────── 진행 ─────────── */
  function next(){
    idx++;
    if(idx>=LINES.length){ finale(); return; }
    busy=true; showHint();
    var i=idx, line=LINES[i];

    if(line.s==="me"){
      // 덕이: 입력창에 한 글자씩 → 완성되면 말풍선으로 한 번에 전송
      type(line.t,"me",setInput,function(){
        setInput("");
        makeRow(line,i,line.t);
        sndSend();
        busy=false; showHint();
      });
    }else{
      // 아란: «입력 중» 점 3개 + 타건음 → 메시지는 한 번에 도착
      var w=document.createElement("div");
      w.className="row you"; w.innerHTML='<div class="dots"><i></i><i></i><i></i></div>';
      thread.appendChild(w); trim();
      // 타건음 없이 «입력 중»만 잠깐 → 메시지 도착
      wait(WAIT_YOU, function(){
        if(w.parentNode) thread.removeChild(w);
        clearUnread();
        makeRow(line,i,line.t);
        sndRecv();
        busy=false; showHint();
      });
    }
  }

  function finale(){
    ended=true; busy=false;
    sndClose();
    frame.classList.add("closing");
    endVeil.classList.add("show");
    showHint();
  }

  function rebuild(upTo){
    thread.innerHTML=""; setInput("");
    frame.classList.remove("closing"); endVeil.classList.remove("show"); ended=false;
    for(var i=0;i<=upTo;i++) makeRow(LINES[i],i,LINES[i].t);
    var u=thread.querySelectorAll(".row.me .unread");
    for(var j=0;j<u.length;j++) u[j].textContent = (LINES[upTo] && LINES[upTo].s==="me" && j===u.length-1) ? "1" : "";
    idx=upTo; busy=false; pending=null; showHint();
  }

  /* ─────────── 입력 ─────────── */
  function advance(){
    if(!started){
      started=true; busy=true; audio();
      startVeil.classList.add("hide");
      setTimeout(function(){ busy=false; next(); },320);
      showHint(); return;
    }
    if(ended) return;
    if(pending){ pending(); return; }   // 타이핑 중 클릭 → 즉시 완성
    if(busy) return;
    next();
  }
  function back(){
    if(pending){ pending(); }
    if(idx<=0){ rebuild(-1); idx=-1; showHint(); return; }
    rebuild(idx-1);
  }
  function restart(){
    if(pending) pending();
    thread.innerHTML=""; setInput("");
    frame.classList.remove("closing"); endVeil.classList.remove("show");
    startVeil.classList.remove("hide");
    idx=-1; busy=false; pending=null; started=false; ended=false; showHint();
  }

  document.addEventListener("click",function(){ advance(); });
  document.addEventListener("keydown",function(e){
    var k=e.key;
    if(k===" "||k==="Enter"||k==="ArrowRight"||k==="PageDown"){ e.preventDefault(); advance(); }
    else if(k==="ArrowLeft"||k==="PageUp"||k==="Backspace"){ e.preventDefault(); back(); }
    else if(k==="r"||k==="R"){ restart(); }
    else if(k==="h"||k==="H"){ hint.classList.toggle("off"); }
    else if(k==="f"||k==="F"){
      if(document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    else if(k==="+"||k==="="){ SPEED=Math.max(20,SPEED-8); showHint(); }
    else if(k==="-"||k==="_"){ SPEED=Math.min(160,SPEED+8); showHint(); }
    else if(k==="]"){ setVol(VOL+0.15); }
    else if(k==="["){ setVol(VOL-0.15); }
  });
  // 어떤 조작이든 오디오 잠금 해제
  document.addEventListener("pointerdown",function(){ audio(); });

  /* ─────────── 진행자 힌트 ─────────── */
  function showHint(){
    var cur = (idx>=0 && idx<LINES.length) ? (LINES[idx].s==="me"?"덕이":"아란")+" — "+LINES[idx].t : "—";
    var nxt = (idx+1<LINES.length) ? (LINES[idx+1].s==="me"?"덕이":"아란")+" — "+LINES[idx+1].t
            : (idx+1===LINES.length ? "폰 닫기 · "+CLOSING : "끝");
    hint.innerHTML =
      '<span><b>'+Math.max(idx+1,0)+' / '+LINES.length+'</b></span>'+
      '<span>지금: '+esc(cur)+'</span>'+
      '<span class="k">다음: '+esc(nxt)+'</span>'+
      '<span class="k">클릭/Space 다음 · ← 뒤로 · R 처음 · F 전체화면 · +/− 속도('+SPEED+'ms) · [ ] 음량('+Math.round(VOL*100)+'%) · H 숨김</span>'+
      '<span class="k">'+(audioOK?"🔊 소리 켜짐":"🔇 첫 클릭 후 소리")+'</span>';
  }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  showHint();
})();
</script>
</body>
</html>
