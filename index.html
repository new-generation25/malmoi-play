/* ── 극적 효과용 사운드 ───────────────────────────────────
   브라우저는 사용자가 한 번 조작하기 전까지 소리를 막는다(AudioContext가
   suspended 로 뜬다). 단독 실행은 진행자가 화면을 클릭해 시작하므로 저절로
   풀리지만, Q-Studio 출력창 안에서는 클릭이 출력창에 떨어지고 iframe 에는
   오지 않아 영영 잠긴 채로 남는다. 그래서 부모 문서의 조작에도 귀를 연다. */
let ac, lastBeep = 0;
function audio() {
  if (!ON_STAGE) return null;   // 조종창 미러에서 겹쳐 울리지 않게 (무대에서만 소리)
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    return ac.state === "running" ? ac : null;
  } catch (e) { return null; }
}
function armAudio() {
  const docs = [document];
  try { if (EMBEDDED && parent.document) docs.push(parent.document); } catch (e) { /* 교차 출처 */ }
  docs.forEach(d => ["pointerdown", "keydown", "touchstart"].forEach(
    ev => d.addEventListener(ev, audio, { capture: true, passive: true })));
}

/* ── 안내 음성 재생 ───────────────────────────────────────
   위 VOICES 표가 시키는 대로만 튼다. 규칙은 셋이다.

   1) 한 번에 하나. 새 안내가 시작되면 앞의 것을 즉시 끊는다 — 앞 장면의 말이
      뒤 화면에 겹쳐 흐르면 사고다.
   2) 한 «작전»에 한 번씩. 같은 단계로 다시 들어와도 두 번 울리지 않는다
      (applyStep 은 같은 단계면 아무 일도 하지 않고, 여기서도 한 번 낸 것은
      기록해 둔다).
   3) 되감기(←)로 앞 단계에 갔다가 다시 오면 «다시 울린다». 되감기는 조종창이
      cueoutStep 을 절대 위치로 부르며 resetStage() 로 장면을 처음부터 다시
      세우는 동작이라, 게이지·말풍선·완료 화면이 전부 0으로 돌아간다. 화면이
      다시 시작하는데 안내만 빠지면 무대와 말이 어긋난다. 리허설에서 그
      대목만 되감아 다시 보는 것이 되감기의 주용도이기도 하다.
      → 그래서 기록(voiceDone)은 resetStage() 에서 지운다.

   ⚠ 소리 잠금 해제는 armAudio() 가 이미 하고 있다. 브라우저의 자동재생 허가는
     «문서» 단위라, 진행자가 출력창을 한 번 클릭하는 늘 하는 동작 하나로
     비프음(AudioContext)과 이 mp3 가 함께 열린다. 그래서 잠금 해제 장치를
     새로 만들지 않았다.
   ⚠ 파일이 없거나 재생이 막혀도 화면 진행은 절대 멈추지 않는다 — play() 가
     돌려주는 거부는 .catch() 로 조용히 삼킨다. */
let voiceNow = null;                  // 지금 울리고 있는 <audio>
let voiceWait = null;                 // delay 대기 타이머
let voiceMute = false;                // 여러 단계를 한꺼번에 지나갈 때 중간 단계를 삼킨다
let gaugeVoiceOff = false;            // 급습 뒤로는 게이지 안내(45·70)가 지난 이야기가 된다
const voiceDone = new Set();
const voiceEls = {};

function voiceEl(key) {               // 미리 받아 두면 무대에서 «말이 늦게 나오는» 일이 없다
  if (!voiceEls[key]) {
    const a = new Audio(VOICE_DIR + VOICES[key].file);
    a.preload = "auto";
    a.volume = VOICE_VOL;
    voiceEls[key] = a;
  }
  return voiceEls[key];
}
function stopVoice() {
  if (voiceWait) { clearTimeout(voiceWait); voiceWait = null; }
  if (voiceNow) {
    try { voiceNow.pause(); voiceNow.currentTime = 0; } catch (e) {}
    voiceNow = null;
  }
}
function playVoice(key) {
  const v = VOICES[key];
  if (!v) return;
  if (PHONE_ONLY || !ON_STAGE) return;      // 관객 폰·조종창 미러에서는 소리내지 않는다
  if (voiceMute || voiceDone.has(key)) return;
  voiceDone.add(key);
  stopVoice();                              // 앞 안내를 끊고 자리를 넘겨받는다
  const fire = () => {
    voiceWait = null;
    const a = voiceEl(key);
    voiceNow = a;
    try { a.currentTime = 0; } catch (e) {}
    const p = a.play();
    if (p && p.catch) p.catch(e => console.warn("안내 음성 실패:", key, e && e.message));
  };
  if (v.delay > 0) voiceWait = setTimeout(fire, v.delay);
  else fire();
}
/* 단계 진입 안내 — 그 단계를 맡은 항목을 표에서 찾아 튼다 */
function stepVoice(step) {
  for (const k in VOICES) if (VOICES[k].on === "step" && VOICES[k].step === step) playVoice(k);
}
/* 진행자 키 안내 — 그 키를 맡은 항목을 표에서 찾아 튼다.
   ⚠ 2026-08-12 에 «게이지 %가 방아쇠» 이던 gaugeVoice() 를 이것으로 갈았다.
     게이지는 관객 수에 따라 오르는 속도가 달라 회차마다 말이 나오는 시각이
     흔들렸다. 지금은 진행자가 누른 그 순간에만 난다. */
function keyVoice(k) {
  for (const key in VOICES) if (VOICES[key].on === "key" && VOICES[key].key === k) playVoice(key);
}

/* 같은 안내를 «다시» 낸다 — playVoice 의 «한 작전에 한 번» 규칙을 비켜 간다.
   경고(5키)만 이 길로 다닌다. 대본이 배우 호흡에 맞춰 경고를 거듭 부를 수
   있어, 두 번째부터 소리가 안 나면 진행자가 «키가 죽었다» 고 읽는다.
   앞의 소리가 아직 흐르고 있으면 끊고 처음부터 다시 낸다 — 겹쳐 울리면
   두 겹이 되어 말이 뭉개진다. */
function replayVoice(key) {
  voiceDone.delete(key);
  stopVoice();
  playVoice(key);
}

/* ── 관객 폰 안내 음성 ─────────────────────────────────────
   무대 것과 따로 둔다. 무대는 «단계» 가 방아쇠라 되감기·중간 단계 삼키기
   같은 규칙이 붙지만, 폰은 그 사람의 화면이 넘어갈 때 한 번 나면 그만이다.
   섞으면 두 규칙이 서로를 망친다. */
const phoneVoiceEls = {};
let phoneVoiceNow = null;

/* 접속 직후 미리 받아 둔다. 방아쇠가 당겨진 뒤에 내려받으면 말이 늦게
   나오고, 극장 와이파이로 수백 대가 한꺼번에 받으면 더 늦는다. */
function preloadPhoneVoices() {
  if (!PHONE_ONLY) return;
  for (const k in PHONE_VOICES) phoneVoiceEl(k);
}
function phoneVoiceEl(k) {
  if (!phoneVoiceEls[k]) {
    const a = new Audio(VOICE_DIR + PHONE_VOICES[k].file);
    a.preload = "auto";
    a.volume = PHONE_VOICE_VOL;
    phoneVoiceEls[k] = a;
  }
  return phoneVoiceEls[k];
}
function playPhoneVoice(k) {
  if (!PHONE_ONLY || !PHONE_VOICES[k]) return;
  /* 앞 말을 끊고 자리를 넘겨받는다 — 폰 화면은 관객이 빠르게 넘길 수 있어
     안내가 겹치면 둘 다 안 들린다. */
  if (phoneVoiceNow) { try { phoneVoiceNow.pause(); phoneVoiceNow.currentTime = 0; } catch (e) {} }
  const a = phoneVoiceEl(k);
  phoneVoiceNow = a;
  try { a.currentTime = 0; } catch (e) {}
  const p = a.play();
  /* 파일이 아직 없거나(굽기 전) 무음 스위치로 막혀도 화면은 그대로 간다 */
  if (p && p.catch) p.catch(e => console.warn("폰 안내 음성 실패:", k, e && e.message));
}

function beep(freq, dur = 0.05, vol = 0.05, type = "triangle") {
  const ctx = audio();
  if (!ctx) return;
  try {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch (e) {}
}
/* ── 작전 완료 팡파르 ─────────────────────────────────────
   예전에는 사인/사각파 네 음을 순서대로 «삐-삐-삐-삐» 울렸다. 음은 맞지만
   악기로 들리지 않아 무대에서 «완료» 로 읽히지 않았다.

   그럴듯한 금관 소리는 세 가지가 같이 있어야 난다.
     1) 톱니파   — 배음이 많아야 금속의 몸통이 생긴다
     2) 유니즌   — 같은 음을 몇 센트 어긋나게 겹쳐야 «한 명» 이 아니라 «파트» 가 된다
     3) 로우패스가 열렸다 닫힘 — 이 움직임이 «부는» 느낌을 만든다. 고정 필터면 죽은 소리다

   리듬은 «따-따-따 　 따-안». 짧은 셋 뒤 긴 화음 하나 —
   이 형태여야 이야기가 «끝났다» 로 들린다. */
function brass(freqs, at, dur, vol) {
  const ctx = audio();
  if (!ctx) return;
  const t = ctx.currentTime + at;
  freqs.forEach(f => {
    [-7, 0, 7].forEach(cent => {                 // 유니즌 3겹
      try {
        const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
        o.type = "sawtooth";
        o.frequency.value = f;
        o.detune.value = cent;
        lp.type = "lowpass";
        lp.frequency.setValueAtTime(600, t);
        lp.frequency.linearRampToValueAtTime(f * 4.5, t + 0.05);   // 열리고
        lp.frequency.linearRampToValueAtTime(f * 1.8, t + dur);    // 닫힌다
        lp.Q.value = 1.2;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol / 3, t + 0.02);
        g.gain.setValueAtTime(vol / 3, t + dur * 0.62);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(lp); lp.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + dur + 0.05);
      } catch (e) {}
    });
  });
}

/* 마지막 화음 위에 얹는 반짝임 — 종/글로켄 자리. 축포가 터지는 순간과 맞춘다. */
function shimmer(at) {
  const ctx = audio();
  if (!ctx) return;
  [2093, 2637, 3136].forEach((f, i) => {
    const t = ctx.currentTime + at + i * 0.05;
    try {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.035, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 1.2);
    } catch (e) {}
  });
}

const G3 = 196, C4 = 261.6, E4 = 329.6, G4 = 392, C5 = 523.3, E5 = 659.3, G5 = 784;
function fanfare() {
  brass([G3, G4], 0.00, 0.13, 0.09);            // 따
  brass([G3, G4], 0.17, 0.13, 0.09);            // 따
  brass([G3, G4], 0.34, 0.13, 0.09);            // 따
  brass([C4, E4, G4, C5, E5], 0.54, 1.70, 0.11);  // 따-안 (C장3화음)
  shimmer(0.60);
}

/* 저음 «쿵» — 화음보다 먼저 때려 바닥을 깔아 준다 */
function boom() {
  const ctx = audio();
  if (!ctx) return;
  const t = ctx.currentTime;
  try {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(130, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.55);   // 떨어지는 피치가 «쿵» 을 만든다
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.13, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.8);
  } catch (e) {}
}
/* 하강음 — «−» 를 누를 때마다 (2026-08-13)
   게이지가 조용히 내려가면 객석은 줄어든 것을 못 본다. 소리가 있어야 하강이
   사건이 된다. 다만 «쿵»(boom) 을 그대로 쓰면 안 된다 — 그건 100% 달성의
   소리라 «끝났다» 로 들리고, 10%씩 네 번 누르는 동안 객석이 지친다.
   그래서 짧게(0.34초) · 높은 데서 시작해 미끄러져 내려가는 소리로 만든다.
   삼각파는 톱니보다 배음이 적어 여러 번 들어도 귀에 거슬리지 않는다. */
function dropSfx() {
  const ctx = audio();
  if (!ctx) return;
  const t = ctx.currentTime;
  try {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(520, t);
    o.frequency.exponentialRampToValueAtTime(150, t + 0.30);   // 미끄러져 내려간다
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.10, t + 0.010);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.36);
  } catch (e) {}
  boom();                                   // 아래를 받치는 낮은 울림
}

/* 경보 — «경고! 경고!» 자리에 깔리는 사이렌.
   한 음을 두 음 사이로 미끄러뜨려야 «사이렌» 으로 들린다. 예전의 400/300
   4연타는 그냥 «삑삑» 이었다. 3회 왕복하고 잦아든다. */
function alarm() {
  const ctx = audio();
  if (!ctx) return;
  try {
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
    o.type = "sawtooth";
    o.frequency.setValueAtTime(880, t);
    for (let i = 0; i < 3; i++) {                 // 오르내림 3회
      o.frequency.exponentialRampToValueAtTime(440, t + i * 0.52 + 0.26);
      o.frequency.exponentialRampToValueAtTime(880, t + i * 0.52 + 0.52);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.075, t + 0.05);
    g.gain.setValueAtTime(0.075, t + 1.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.62);
    const lp = ctx.createBiquadFilter();          // 날 선 고음을 깎아 귀를 보호한다
    lp.type = "lowpass"; lp.frequency.value = 2200;
    o.connect(lp); lp.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 1.7);
  } catch (e) {}
}

/* ── 관객 투표 «접수» 효과음 ───────────────────────────────
   TV 퀴즈쇼의 투표 집계음을 성질만 가져와 합성한다. 그 소리의 정체는
   «짧은 어택 + 두 배음이 겹친 종소리 + 빠른 감쇠» 다. 정답은 5도 위
   배음을 얹어 밝게, 오답은 배음 없이 둔하게 떨어뜨린다.

   ⚠ 방송 효과음 파일을 그대로 쓰지 않는다. 공연은 «공개 상연» 이라
     방송사 음원을 얹으면 저작권 문제가 된다. 소리의 성격만 흉내 낸다.
   ⚠ 수백 명이 동시에 답하면 이 소리가 겹쳐 잡음이 된다. addAnswer 의
     45ms 간격 제한이 그것을 막는다 — 그 제한을 풀지 말 것. */
function voteSfx(hit) {
  const ctx = audio();
  if (!ctx) return;
  const t = ctx.currentTime;
  /* 종의 «땡» 은 기음 하나로는 안 난다. 배음을 겹쳐야 금속 느낌이 생긴다. */
  const parts = hit ? [[880, 0.09], [1320, 0.06], [1760, 0.03]]
                    : [[392, 0.08], [262, 0.05]];
  parts.forEach(([f, v]) => {
    try {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + 0.006);   // 딱 붙는 어택
      g.gain.exponentialRampToValueAtTime(0.0001, t + (hit ? 0.42 : 0.26));
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.5);
    } catch (e) {}
  });
}

/* ── 실제로 스캔되는 QR 생성 (오류정정 레벨 M) ──────────── */
function drawQR() {
  const qr = qrcode(0, "M");          // 0 = 데이터 길이에 맞춰 버전 자동 선택
  qr.addData(JOIN_URL);
  qr.make();
  /* cell 을 키우면 QR 이 그만큼 커진다. 객석 뒤쪽에서도 폰 카메라가 잡아야 해서
     8 → 11 로 올렸다(296px → 407px). quiet zone 4모듈은 규격상 반드시 남긴다 —
     여백을 줄이면 스캔이 안 된다. */
  const N = qr.getModuleCount(), cell = 11, quiet = 4;
  const size = (N + quiet * 2) * cell;
  let rects = "";
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
    if (qr.isDark(y, x))
      rects += `<rect x="${(x+quiet)*cell}" y="${(y+quiet)*cell}" width="${cell}" height="${cell}"/>`;
  $("qrBox").innerHTML =
    `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges">
       <rect width="${size}" height="${size}" fill="#fff"/>
       <g fill="#0d0b12">${rects}</g>
     </svg>`;
  setText("qrUrl", JOIN_URL);      // 화면에서 뺐다 — 없으면 그냥 넘어간다
}

/* ── 게이지 ────────────────────────────────────────────────
   관객 수를 미리 알 수 없으므로 «목표 대비 비율»을 쓰지 않는다.
   대신 응답이 쌓일수록 상승폭이 줄며 90%에 수렴하는 곡선을 쓴다.
   응답 HALF건에서 절반(45%), 그 뒤로는 천천히 90%에 다가간다.
   덕분에 관객이 30명이든 300명이든 게이지가 거꾸로 가거나 멈추지 않는다.

   여기에 진행자가 70/90/100으로 개입할 수 있다.
   · 70(급습) → 그 지점을 새 바닥으로 삼아 다시 자연 상승을 이어간다
   · 90/100   → 그 값에 고정한다(엔딩 연출) */
const rawPct = () => MAX_PCT * answered / (answered + HALF);
function shownPct() {
  if (pinned !== null) return pinned;
  const p = rawPct();
  if (!anchor) return p;
  if (anchor.at >= MAX_PCT) return anchor.to;     // 0으로 나누는 것을 막는다
  return anchor.to + (p - anchor.at) * (MAX_PCT - anchor.to) / (MAX_PCT - anchor.at);
}
function paintGauge() {
  const p = shownPct();
  $("pctNum").textContent = Math.round(p);
  $("gaugeFill").style.height = p + "%";   // 세로 기둥 — 아래에서 위로 찬다
}

/* 애니메이션을 다시 트리거한다. 클래스를 떼었다 붙이는 것만으로는 같은 프레임에
   합쳐져 아무 일도 일어나지 않으므로, 그 사이에 강제로 리플로우를 끼운다. */
function pulse(el, cls, ms) {
  if (!el) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}

/* ── 응답 1건 도착 ───────────────────────────────────────
   참여퀴즈창에서 관객이 한 문제 풀 때마다 여기로 온다(폴링이 물어 온다).
   무대에서는 «말풍선 + 기둥 출렁 + 숫자 튐 + 소리» 네 가지가 같이 난다. */
function addAnswer(hit, word) {
  answered++;
  setText("answeredNum", "응답 " + answered);
  paintGauge();
  popBubble(hit, word);

  if (!$("gaugeFill").classList.contains("drop")) pulse($("gaugeFill"), "surge", 450);
  pulse($("pctNum"), "bump", 350);
  /* ⚠ 예전에는 여기서 gaugeVoice() 를 불러 45·70% 안내를 냈다. 2026-08-12 에
     «수치에 따른 안내 송출» 을 통째로 뺐다 — VOICES 표 위쪽 설명 참고. */

  /* 정답은 높고 맑게, 오답은 낮고 둔하게 — 무대에서 분위기가 읽힌다.
     45ms 안에 몰린 응답은 소리를 겹치지 않는다(뭉개져서 잡음이 된다). */
  if (Date.now() - lastBeep > 45) {
    lastBeep = Date.now();
    voteSfx(hit);      // 투표 접수 — 정답은 밝은 종, 오답은 둔한 음
  }
}

/* ── 말풍선 뿅 ─────────────────────────────────────────── */
const BUBBLE_MAX = 14;                 // 400건이 다 떠오르면 화면이 죽는다

/* 관객이 보낸 «아름다운 우리말» 을 무대에 띄울지. W 키로 끈다 —
   익명 접속이라 무엇이 올지 막을 수 없고, 공개 상연 중 이상한 말이 무대에
   뜨면 되돌릴 방법이 없다. 꺼도 게이지는 그대로 오른다. */
let showWords = true;

function popBubble(hit, word) {
  const field = $("bubbles");
  if (field.childElementCount >= BUBBLE_MAX) return;
  const b = document.createElement("div");
  b.className = "bubble" + (hit ? " hit" : "");
  /* ⚠ 퀴즈 답은 여기 넣지 않는다 — 관객마다 푸는 속도가 달라, 정답 글자가
     무대에 떠 있으면 아직 못 푼 사람이 보고 답을 알아 버린다. 글자가 들어오는
     것은 «우리말 모으기» 로 보낸 자유 입력뿐이고, 그것은 정답이 없다. */
  if (word && showWords) { b.textContent = word; b.classList.add("word"); }
  b.style.left = (4 + Math.random() * 92) + "%";
  b.style.animationDelay = (Math.random() * .12) + "s";
  field.appendChild(b);
  setTimeout(() => b.remove(), 2900);
}

/* ── 로비: 관객이 하나씩 접속 ───────────────────────────── */
function startLobby() {
  if (PHONE_ONLY) {                    // 관객 폰: 무대 연출 없이 곧장 폰 화면만
    document.body.classList.add("phone-only");
    joinLive();                        // 접속했음을 서버에 알린다
    watchFinish();                     // 무대가 «작전 성공»을 알리면 같이 축포
    preloadPhoneVoices();              // 지령 음성을 미리 받아 둔다(말이 늦지 않게)
    renderPhoneLobby();
    return;
  }
  document.body.classList.add("stage"); // 무대: 폰 목업을 숨긴다
  armAudio();                           // 첫 조작이 오는 즉시 소리 잠금을 푼다
  if (ON_STAGE) Object.keys(VOICES).forEach(voiceEl);   // 안내 음성을 미리 받아 둔다
  /* 0단계는 타이틀이다 — 접속 인원을 숨긴다. QR 은 1단계에서 그린다
     (숨겨 둔 상자는 크기가 0 이라 지금 그리면 보이지 않는다). */
  $("joinBox").style.display = "none";
  showOpBar();
  // 실집계: 기준점을 찍은 뒤(poll 이 baselined 를 기다린다) 새 접속자만 표시
  if (LIVE) { baselined = takeBaseline(); poll(); startPolling(); return; }
  simulateJoin();                                 // 미설정: 가상 관객이 접속하는 척
}

/* 미설정(시뮬레이션) 시 로비에서 관객이 하나씩 붙는 연출 */
function simulateJoin() {
  const tick = () => {
    if (joined >= TOTAL) return;
    joined++;
    paintJoin();
    beep(300 + joined * 8, 0.03, 0.02);
    later(tick, 60 + Math.random() * 90);
  };
  later(tick, 400);
}
function paintJoin() {
  $("joinNum").textContent = joined;
  // 실집계에는 목표 인원이 없으므로 50명을 눈금 삼아 채운다(넘으면 가득)
  $("joinFill").style.width = Math.min(joined / TOTAL * 100, 100) + "%";
}

/* ── 작전 개시 (무대는 화면 클릭, 관객 폰은 시작 버튼) ──── */
function startPlay() {
  phase = "play";
  qi = 0;
  if (!PHONE_ONLY) {
    $("title").style.display = "none";
    $("joinBox").style.display = "";
  }
  showPane("stage");
  $("counter").textContent = "작전 진행 중";
  paintGauge();
  if (PHONE_ONLY) { renderPhoneSection(0); return; }  // 관객 폰: 구분 화면부터
  $("gaugeMsg").textContent = LIVE ? "관객의 응답을 모으는 중…" : "시뮬레이션 진행 중…";
  /* ⚠ 2026-08-12 — 여기 있던 stepVoice(1)(«작전에 참여하신 미래의 여러분…») 을
     뺐다. 그 안내는 이제 관객 폰에서 각자 난다(PHONE_VOICES.참여감사). */
  showOpBar();
  if (LIVE) return;                                   // 실집계는 이미 폴링이 돌고 있다
  clearTimers();
  scheduleCrowd();                                    // 미설정일 때만 가상 관객
}

/* ── 회차 초기화 ──────────────────────────────────────────
   무대 화면을 새로 열면 지난 수치(리허설·직전 회차)가 남아 있으면 안 된다.
   응답은 브라우저가 아니라 서버에 쌓이므로 새로고침만으로는 지워지지 않는다.
   지우지는 않는다. 서버 행을 지우려면 DELETE 권한이 필요한데, RLS 에 DELETE
   정책이 없으면 PostgREST 는 204를 돌려주면서 «0행»을 지운다 — 성공한 것처럼
   보이고 아무 일도 일어나지 않는다(2026-08-09 실측).

   대신 «무대 화면이 열린 이 순간»을 기준점으로 찍고, 그보다 새로운 것만 센다.
   SELECT 권한만으로 되고, 실집계를 실수로 날릴 위험도 없다.

   · 응답  → 마지막 id (lastId) 보다 큰 행만

   ⚠ 기준점은 서버가 가진 값에서 가져온다. 브라우저 시계로 «지금»을 만들면
     서버와 몇 초만 어긋나도 응답이 통째로 새거나 묻힌다.
   ⚠ 관객 폰(PHONE_ONLY)에서는 부르지 않는다. 폰은 셀 것이 없다.
   ⚠ 페이지 로드 때 한 번뿐이다. resetStage()(큐 재시작·되감기)에 넣으면
     공연 중 큐로 되돌아올 때마다 응답이 사라진다.

   ## ⚠ 접속 인원에는 기준점을 쓰지 않는다 (2026-08-13 수정)
   예전에는 접속도 «무대 화면이 열린 뒤» 만 셌다. 그런데 Q-Studio 는 큐를 GO 할
   때마다 iframe 을 새로 띄우고, 그때 이 기준점이 다시 잡힌다 — **이미 접속해
   있던 관객이 통째로 0 이 된다.** 리허설에서 폰을 먼저 붙여 두고 큐를 GO 하면
   무대에 영영 «접속 0명» 이 뜬다(실제로 이 증상으로 발견했다).

   지금은 **그 회차(SESSION)의 참여자를 전부 센다.** 지난 회차 수치가 섞이는
   것은 기준점이 아니라 `?s=` 회차 분리로 막는다(4-1). 그게 원래 그 장치의 몫이다. */
let baselined = Promise.resolve();
async function takeBaseline() {
  if (!LIVE || PHONE_ONLY) return;
  try {
    const r = await db(`answers?session=eq.${SESSION}&select=id&order=id.desc&limit=1`);
    const rows = await r.json();
    lastId = rows.length ? rows[0].id : 0;
  } catch (e) { console.warn("응답 기준점 실패:", e.message); }
  answered = 0;
  joined = 0;
  paintJoin();
  paintGauge();
}

/* ── 실집계 폴링 ──────────────────────────────────────────
   1초마다 (1) 새 응답을 증분 조회하고 (2) 접속 인원을 센다.
   증분 조회라 트래픽이 작고, 총계를 매번 다시 읽으므로
   한 번 실패해도 다음 폴링에서 스스로 복구된다. */
function startPolling() {
  if (poller) clearInterval(poller);
  poller = setInterval(poll, 1000);
}
let polling = false;
async function poll() {
  if (polling) return;                 // 응답이 느릴 때 요청이 겹치지 않게
  polling = true;
  try {
    await baselined;                   // 기준점이 잡히기 전에 지난 행을 읽지 않는다
    /* text 까지 읽는다 — «우리말 모으기»(qi = QI_WORD) 로 들어온 글자는
       무대 말풍선에 그대로 띄운다. 퀴즈 답(qi 0~7)의 text 는 읽어도 버린다. */
    const r = await db(`answers?session=eq.${SESSION}&id=gt.${lastId}` +
                       `&select=id,qi,hit,text&order=id.asc&limit=200`);
    const rows = await r.json();
    for (const row of rows) {
      lastId = Math.max(lastId, row.id);
      if (row.qi < 0) continue;                     // 폰에 보낸 신호 행(작전 성공·우리말 개시)
      const word = row.qi === QI_WORD ? String(row.text || "").slice(0, WORD_MAX) : null;
      /* 우리말 모으기가 열려 있으면 낱말은 빙고판·낱말 벽으로 간다.
         게이지도 같이 올린다 — 관객이 보낸 말이 원고를 되찾는다는 규칙은
         화면이 바뀌어도 그대로다. */
      if (word && wordsOpened) addWord(word);
      if (phase === "play") addAnswer(!!row.hit, wordsOpened ? null : word);
      else { answered++; setText("answeredNum", "응답 " + answered); }
    }
    if (phase === "play" && !rows.length) paintGauge();

    /* 접속 인원 — 그 회차에 들어온 관객을 «전부» 센다.
       ⚠ 2026-08-13 — 여기 있던 joined_at 기준점 필터를 뺐다. 큐를 GO 할 때마다
         기준점이 다시 잡혀 이미 접속한 관객이 0 이 됐다(takeBaseline 설명 참고).
         회차가 섞이는 것은 `?s=` 로 막는다. */
    const p = await db(`participants?session=eq.${SESSION}&select=device`,
                       { headers: { Prefer: "count=exact", Range: "0-0" } });
    const cr = p.headers.get("content-range");       // 예: "0-0/37"
    const n = cr && +cr.split("/")[1];
    if (Number.isFinite(n)) { joined = n; paintJoin(); }
    netOK(true);
  } catch (e) {
    netOK(false, e.message);
  } finally {
    polling = false;
  }
}
/* 네트워크 상태를 진행자 바에 표시한다. 공연 중 조용히 끊기는 것이 가장 위험하다. */
let netFails = 0;
function netOK(ok, msg) {
  if (ok) { netFails = 0; } else { netFails++; console.warn("집계 폴링 실패:", msg); }
  showOpBar();
}

/* ── 시뮬레이션(Supabase 미설정 시에만) ───────────────────
   가상 관객 50명이 각자 다른 속도로 8문제를 푼다. 실집계가 켜지면
   이 함수는 호출되지 않는다. 리허설·데모용 대체 동작이다. */
function scheduleCrowd() {
  for (let p = 0; p < TOTAL; p++) {
    let t = 300 + Math.random() * 2500;             // 문제를 읽기 시작하는 시점
    for (let k = 0; k < QUESTIONS.length; k++) {
      t += 700 + Math.random() * 2600;              // 한 문제당 걸리는 시간
      const q = QUESTIONS[k];
      later(() => addAnswer(Math.random() < 0.62), t);   // 정답률 62%
    }
  }
}

/* ── 5키 — 경고 (2026-08-13 오후 개편) ─────────────────────
   ⚠ **게이지를 건드리지 않는다.** 예전에는 이 키가 60% 로 떨어뜨렸는데,
     새 대본에서 하강은 오로지 «−» 가 맡는다(진행자가 손으로 깎는다).
     5키가 하는 일은 «경고를 낸다» 뿐이다 — 화면 깜박임 + 사이렌 + 음성.

   ⚠ **몇 번이고 다시 눌러 쓴다.** 대본이 배우 호흡에 맞춰 경고를 거듭
     부를 수 있어, 안내 음성의 «한 작전에 한 번» 규칙(playVoice)을 여기서만
     비켜 간다. 앞의 소리가 아직 흐르고 있으면 끊고 처음부터 다시 낸다. */
function warnFlash() {
  const v = $("verdict");
  v.className = "verdict show bad warn-blink";
  v.innerHTML = `경 고<div class="sub">우 리 말 을 　 지 켜 　 주 십 시 오</div>`;
  clearTimeout(warnFlash._t);
  warnFlash._t = setTimeout(() => { v.className = "verdict"; }, WARN_MS);

  $("gaugeMsg").textContent = "우리말을 사랑하는 힘이 부족합니다 — 다시 채워 주십시오!";
  alarm();
  replayVoice("경고");                // 중복 재생 허용 — 위 설명 참고
}


/* ══════════════ 우리말 모으기 — 무대 (2026-08-13) ══════════════
   진행자가 6키를 누르면 열린다. 왼쪽 빙고판, 오른쪽 낱말 벽.

   판이 켜지는 규칙은 하나다 — **관객이 보낸 말에 들어 있는 글자가 판에 있으면
   그 칸이 켜진다.** 「사랑」 을 보내면 「사」 가 켜지는 식이다. 관객이 판을
   맞히려고 애쓸 필요가 없다. 아무 우리말이나 보내도 판이 조금씩 밝아지고,
   그것이 «흩어진 말을 모아 원고를 되살린다» 는 이 장면의 그림이 된다.

   ⚠ 관객에게 판을 «풀라» 고 시키지 않는다. 폰 화면은 그냥 입력창이고,
     판은 무대에서 저절로 켜진다. 관객이 판을 보고 글자를 맞추려 들면 고개가
     다시 폰으로 내려가는데, 이 장면은 무대를 올려다보게 하려고 만든 자리다.
   ⚠ 사석 다섯 칸은 어느 낱말에도 없는 글자라 **영영 켜지지 않는다.** 그래서
     «31 글자» 를 세어 보여준다 — 36 으로 세면 영원히 채워지지 않는다. */
let bingoTiles = [];                    // [{ch, dead}] 36칸
let litCells = new Set();               // 켜진 칸 번호
let wordsOpened = false;                // 6키를 이미 눌렀나

const bgShuffle = a => {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* 낱말을 글자로 펴서 겹치는 것을 합친다. 36칸을 넘으면 뒤쪽 낱말을 버린다 —
   공연 중에는 판이 깨지는 것보다 낱말 하나가 조용히 빠지는 편이 낫다. */
function makeBoard() {
  const seen = new Set();
  for (const w of BINGO_WORDS) {
    const next = new Set(seen);
    for (const ch of w) next.add(ch);
    if (next.size > BINGO_N * BINGO_N) { console.warn("빙고판 36칸을 넘어 제외:", w); continue; }
    next.forEach(ch => seen.add(ch));
  }
  const letters = [...seen];
  const decoy = BINGO_DECOY.filter(d => !seen.has(d))
                           .slice(0, BINGO_N * BINGO_N - letters.length);
  const tiles = letters.map(ch => ({ ch, dead: false }))
                       .concat(decoy.map(ch => ({ ch, dead: true })));
  while (tiles.length < BINGO_N * BINGO_N) tiles.push({ ch: "·", dead: true });
  return bgShuffle(tiles);
}

/* 6키 — 우리말 모으기를 연다. 여러 번 눌러도 판은 그대로 두고 신호만 다시
   보낸다. 늦게 접속한 폰은 앞의 신호를 못 보므로(폰은 접속 시점 이후 신호만
   본다), 진행자가 한 번 더 눌러 주우면 된다. */
function openWords() {
  if (phase !== "play") applyStep(2);
  signalPhones(QI_WORDS);                       // 폰을 입력창으로
  if (wordsOpened) { $("gaugeMsg").textContent = "우리말을 모으는 중… (신호 다시 보냄)"; return; }
  wordsOpened = true;

  bingoTiles = makeBoard();
  litCells.clear();
  const board = $("swBoard");
  board.innerHTML = "";
  bingoTiles.forEach((t, i) => {
    const c = document.createElement("div");
    c.className = "sw-cell" + (t.dead ? " dead" : "");
    c.textContent = t.ch;
    c.dataset.i = i;
    board.appendChild(c);
  });
  $("swWall").innerHTML = "";
  $("swTotal").textContent = bingoTiles.filter(t => !t.dead).length;
  $("swLit").textContent = "0";
  showPane("words");
  $("counter").textContent = "우리말을 모으는 중";
  showOpBar();
}

/* 관객이 보낸 말 한 마디가 도착했다. 오른쪽 벽에 붙이고, 그 글자가 판에
   있으면 켠다. 무대 노출을 끈 상태(W)라도 판은 켜진다 — 글자 하나하나는
   누가 보냈는지 알 수 없어 위험하지 않고, 그것마저 멈추면 장면이 죽는다. */
function addWord(text) {
  if (!wordsOpened) return;
  let hit = false;
  for (const ch of text) {
    bingoTiles.forEach((t, i) => {
      if (t.dead || t.ch !== ch || litCells.has(i)) return;
      litCells.add(i);
      hit = true;
      const cell = $("swBoard").children[i];
      if (cell) {
        cell.classList.add("lit", "just");
        setTimeout(() => cell.classList.remove("just"), 520);
      }
    });
  }
  $("swLit").textContent = litCells.size;

  if (showWords) {
    const wall = $("swWall");
    const el = document.createElement("div");
    el.className = "sw-word" + (hit ? " hit" : "");
    el.textContent = text;                      // ⚠ innerHTML 금지 — 관객이 쓴 글자다
    wall.insertBefore(el, wall.firstChild);
    /* 넘치면 오래된 것부터 걷는다. 스크롤이 없는 화면이라 그냥 두면
       아래로 밀려 나가 «벽이 멈춘 것» 처럼 보인다. */
    while (wall.childElementCount > 60) wall.removeChild(wall.lastChild);
  }
  if (hit) voteSfx(true);
}

/* ── 진행자 개입 ──────────────────────────────────────────
   실집계가 게이지를 몰지만, 연출상 필요한 순간에는 진행자가
   값을 직접 잡는다. 70은 «바닥을 새로 깔고 다시 오르게», 90/100은 «고정».  */
function dropToPct(to) {          // 70 — 여기서부터 실집계로 다시 차오른다
  anchor = { to, at: rawPct() };
  pinned = null;
  paintGauge();
  showOpBar();
}
/* 진행자가 값을 직접 지정한다 — 7(70) · 9(90) · 0(100) · −(10씩 감소).
   그 값에 못박으므로 이 뒤로는 관객 응답이 게이지를 밀지 않는다.
   실집계로 돌아가려면 A 를 누른다. */
function pinPct(to) {
  pinned = Math.max(0, Math.min(100, Math.round(to)));
  paintGauge();
  $("gaugeMsg").textContent =
      pinned >= 100 ? "말모이 원고가 완전히 복원되었습니다!"
    : pinned >= 85  ? "원고가 거의 복원되었습니다…"
    :                 "원고를 되찾는 중…";
  if (pinned >= 100) celebrate();  // 100%는 곧 엔딩이다
  showOpBar();
}

/* − 키 — 지금 보이는 값에서 10%씩 깎는다. 0% 아래로는 내려가지 않는다.
   실집계 중이든 이미 고정된 뒤든 «화면에 보이는 값» 을 기준으로 삼는다.

   2026-08-13 — 누를 때마다 소리와 흔들림이 같이 난다. 무대 게이지가 조용히
   내려가면 객석에서는 «줄었다» 는 것을 알아채지 못한다. 소리가 있어야 하강이
   사건이 된다. 다만 한 번에 10%씩 여러 번 누르는 조작이라 짧고 가볍게 낸다 —
   급습 사이렌만큼 크면 네 번 누르는 동안 객석이 지친다. */
function stepDown() {
  const from = shownPct();
  pinPct(from - 10);
  if (from <= 0) return;                      // 바닥에서는 소리도 내지 않는다
  dropSfx();
  $("gaugeFill").classList.add("drop");
  $("screen").classList.add("shake");
  setTimeout(() => $("screen").classList.remove("shake"), 260);
  setTimeout(() => $("gaugeFill").classList.remove("drop"), 900);
}

/* ── 축포 ──────────────────────────────────────────────────
   양쪽 아래에서 조각이 솟구쳤다 흩어져 떨어진다. 조각마다 궤적이 달라야
   «펑» 하고 터진 것으로 보이므로 CSS 키프레임 대신 각자 애니메이션을 준다. */
/* 축포 — 마키 간판 색(마젠타·시안·전구 골드)으로 맞춘다 */
const CONFETTI = ["#ff3d9a", "#22e0f0", "#ffd34d", "#ff8fc4", "#7be9f5", "#fff0b8"];
function confetti(n = 110) {
  const box = $("confetti");
  if (!box) return;
  const W = box.clientWidth, H = box.clientHeight;
  for (let i = 0; i < n; i++) {
    const left = i % 2 ? W * 0.14 : W * 0.86;          // 좌·우 두 문에서 쏜다
    const aim = i % 2 ? 1 : -1;                        // 각자 화면 안쪽으로
    const w = 6 + Math.random() * 8;
    const p = document.createElement("i");
    p.style.cssText = `left:${left}px; top:${H}px; width:${w}px; height:${w * .6}px;` +
                      `background:${CONFETTI[i % CONFETTI.length]}`;
    box.appendChild(p);
    const dx = aim * W * (0.15 + Math.random() * 0.6);
    const up = -H * (0.45 + Math.random() * 0.5);
    p.animate([
      { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
      { transform: `translate(${dx * .55}px, ${up}px) rotate(${200 + Math.random() * 300}deg)`,
        opacity: 1, offset: .42 },
      { transform: `translate(${dx}px, ${H * .3}px) rotate(${600 + Math.random() * 700}deg)`,
        opacity: 0 },
    ], { duration: 1700 + Math.random() * 900, easing: "cubic-bezier(.2,.55,.35,1)" })
     .onfinish = () => p.remove();
  }
}

/* 100% 달성 — 축포를 터뜨리고 1초 뒤 스스로 종료 화면으로 넘어간다.
   진행자가 따로 종료를 누르지 않아도 장면이 닫히게 하려는 것이다. */
function celebrate() {
  confetti();
  boom();
  fanfare();
  signalFinish();          // 관객 폰에도 같은 엔딩을 띄운다
  later(finish, 1000);
}

/* ── 무대 → 관객 폰 «작전 성공» 신호 ───────────────────────
   두 화면을 잇는 통로가 Supabase 뿐이라 여기로 보낸다. 테이블을 새로 만들지
   않으려고 answers 에 qi = -1 인 «신호 행»을 한 줄 넣는다(스키마 변경 없음).
   무대 폴링은 qi < 0 인 행을 응답으로 세지 않고 건너뛴다. */
let finishSignalled = false;      // 한 번의 엔딩에 신호는 한 줄만
async function signalFinish() {
  if (!LIVE || finishSignalled) return;
  finishSignalled = true;
  signalPhones(QI_FINISH);
}

/* 무대 → 폰 신호. answers 테이블에 음수 qi 한 줄을 남기면 폰이 폴링으로
   주워 간다. 두 화면을 잇는 통로가 Supabase 뿐이라 이 길밖에 없다.
   실패해도 조용히 넘어간다 — 무대 진행을 막으면 안 된다. */
async function signalPhones(qNo) {
  if (!LIVE) return;
  try {
    await db("answers", {
      method: "POST",
      body: JSON.stringify({ device: "__stage__", session: SESSION, qi: qNo, text: "signal", hit: true }),
    });
  } catch (e) { console.warn("폰 신호 전송 실패:", qNo, e.message); }
}
function autoPct() {              // 개입 해제 — 실집계 값으로 되돌린다
  pinned = null; anchor = null;
  paintGauge();
  $("gaugeMsg").textContent = LIVE ? "관객의 응답을 모으는 중…" : "시뮬레이션 진행 중…";
  showOpBar();
}

/* 1 키 — 의견 한 건을 손으로 올린다. 게이지가 1%p 오르고, 말풍선·소리·출렁까지
   진짜 응답이 도착한 것과 똑같이 난다.
   집계가 끊겼을 때(«집계 끊김» 표시) 진행자가 장면을 이어 갈 수 있게 하는 것이
   목적이다. 7/9/0 은 한 번에 크게 뛰지만 이건 한 칸씩이라 리듬을 만들 수 있다.
   pinned 를 쓰므로 이 뒤로는 실집계가 게이지를 밀지 않는다 — A 로 되돌린다. */
function bumpOne() {
  pinned = Math.min(100, Math.round(shownPct()) + 1);
  addAnswer(Math.random() < 0.62);   // 카운터·말풍선·소리·출렁을 진짜 응답과 같게
  showOpBar();
}

/* ── 진행자 조작 바 (관객석에서 안 보이도록 화면 맨 아래) ── */
function showOpBar() {
  if (PHONE_ONLY) return;
  if (EMBEDDED) return;      // 출력 화면에는 콘텐츠 말고 아무것도 그리지 않는다 (Q-Studio 원칙)
  const bar = $("opbar");
  if (!bar) return;
  const mode = pinned !== null ? `고정 ${pinned}%`
             : anchor ? `${Math.round(anchor.to)}%에서 재상승`
             : "실집계 그대로";
  const net = !LIVE ? '<b class="warn">시뮬레이션 (Supabase 미설정)</b>'
            : netFails === 0 ? '<b class="ok">집계 연결됨</b>'
            : `<b class="warn">집계 끊김 ${netFails}회</b>`;
  bar.innerHTML =
    `<span>${net}</span>` +
    `<span>접속 <b>${joined}</b> · 응답 <b>${answered}</b> · 게이지 <b>${Math.round(shownPct())}%</b></span>` +
    `<span>모드: ${mode}</span>` +
    `<span>우리말 노출: <b class="${showWords ? "ok" : "warn"}">${showWords ? "켜짐" : "꺼짐(W)"}</b></span>` +
    `<span class="k">클릭 진행 · <b>1</b> +1% · <b>−</b> 10%↓+소리 · <b>5</b> 경고(반복가능) · ` +
    `<b>6</b> 우리말 모으기${wordsOpened ? "(열림·재신호)" : ""} · <b>7</b> 70% · ` +
    `<b>9</b> 90%+맨트 · <b>0</b> 100%+축포→종료 · <b>A</b> 자동 · <b>W</b> 낱말노출 · <b>H</b> 숨김</span>`;
}

/* ── 종료 ──────────────────────────────────────────────── */
function finish() {
  phase = "end";
  /* 관객 폰도 같이 닫는다.
     ⚠ 예전에는 celebrate()(0 키·100% 경로)만 신호를 보내서, 큐 단계로 끝내면
       무대만 닫히고 객석의 폰에는 퀴즈가 그대로 남았다(2026-08-12 E2E 에서 발견).
       signalFinish() 는 한 번만 나가므로 celebrate() 를 거쳐 와도 중복되지 않는다. */
  signalFinish();
  clearTimers();
  if (poller) { clearInterval(poller); poller = null; }   // 폴링 정지
  const p = Math.round(shownPct());
  showPane("done");
  $("counter").textContent = "";
  setText("hint", "");
  /* 100%로 끝내면(0 키) «나머지 0%는 여러분의 입으로» 가 되어 말이 안 된다.
     그때는 다 되찾았다는 쪽으로 문장을 바꾼다. */
  $("done").innerHTML = `
    <h1 class="neon">작전 완료</h1>
    <p style="font-size:17px;line-height:2">
      말모이 원고를 <b style="color:var(--gold);font-size:30px">${p}%</b> 되찾았습니다.<br>
      ${p >= 100
        ? "여러분의 입이 원고를 전부 되살렸습니다."
        : `나머지 ${100 - p}%는… 여러분의 입으로 이어 주십시오.`}<br>
      와우, 여러분은 경상도 토박이시군요!<br><br>
      <span style="font-size:14px;color:var(--text-faint)">— 이어서 「경상도 노래부르기 작전」으로 —</span>
    </p>
    ${EMBEDDED ? "" : `<p style="font-size:12px;color:var(--text-faint)">Space 를 누르면 처음부터 다시</p>`}`;
  fanfare();
  stepVoice(3);                 // «축하드립니다. 한글 에너지 충전 완료!»
  $("phone").innerHTML = `<div class="ph-body"><div class="ph-done"><div class="big">🏮</div>작전 완료!<br>고맙습니데이~</div></div>`;
}

/* ── 관객 폰 → 서버 전송 ──────────────────────────────────
   폰에는 게이지가 없다. 답을 서버로 보내고, 무대가 그것을 읽어 간다.
   전송이 실패해도 관객의 퀴즈 진행은 막지 않는다(공연이 멈추면 안 된다). */
const DEVICE = (() => {
  try {
    let d = localStorage.getItem("malmoi-device");
    if (!d) { d = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("malmoi-device", d); }
    return d;
  } catch (e) { return Math.random().toString(36).slice(2); }
})();

async function joinLive() {
  if (!LIVE) return;
  try {
    await db("participants", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates" },   // 새로고침해도 중복 집계 안 됨
      body: JSON.stringify({ device: DEVICE, session: SESSION }),
    });
  } catch (e) { console.warn("접속 등록 실패:", e.message); }
}

/* qNo — 빙고는 문제 번호가 따로 없어 QUESTIONS 뒤 번호를 붙여 보낸다.
   ⚠ 음수는 쓰면 안 된다. qi = -1 은 무대가 폰에 보내는 «작전 성공» 신호이고,
     무대 폴링은 qi < 0 인 행을 게이지에서 통째로 건너뛴다(poll). */
async function sendAnswer(text, hit, qNo = qi) {
  if (!LIVE) { addAnswer(hit); return; }         // 미설정이면 로컬 집계로 대체
  try {
    await db("answers", {
      method: "POST",
      body: JSON.stringify({ device: DEVICE, session: SESSION, qi: qNo, text, hit }),
    });
  } catch (e) { console.warn("응답 전송 실패:", e.message); }
}

/* ── 관객 폰 화면 ──────────────────────────────────────── */
function renderPhoneLobby() {
  /* 그림 파일이 없으면 그림만 조용히 사라지고 나머지는 그대로 동작한다.
     공연 직전에 그림을 교체하다 실패해도 관객이 퀴즈를 못 푸는 일은 없어야 한다. */
  $("phone").innerHTML = `
    <div class="ph-head"><div class="ph-top">말모이 작전 · 1942 경성</div></div>
    <div class="ph-body ph-landing">
      <div class="sec-title neon" style="font-size:26px">말 모 이 　 작 전</div>
      <button class="ph-art" id="phArt" aria-label="작전 시작">
        <img src="landing.jpg" alt="말모이 작전" width="900" height="1342"
             onerror="this.closest('.ph-art').remove()">
      </button>
      <div class="ph-lead">
        접속 완료!<br>
        <b>그림이나 아래 버튼</b>을 누르면 시작합니다.<br>
        <b style="color:var(--cyan)">🔈 소리를 켜 주세요</b> — 작전 지령이 폰으로 옵니다<br>
        <span style="font-size:.85em;color:var(--text-faint)">순사에게 들키지 않도록 조용히 수행해 주세요</span>
      </div>
    </div>
    <div class="ph-foot"><button class="ph-send" id="phStart">작전 시작</button></div>`;
  /* ⚠ 이 탭이 폰의 «소리 잠금» 을 푸는 유일한 손짓이다. 그래서 첫 안내는
     랜딩에 뜨는 순간이 아니라 여기를 누른 «직후» 에 튼다(phoneStart). */
  $("phStart").onclick = phoneStart;
  if ($("phArt")) $("phArt").onclick = phoneStart;
}

/* 관객이 «작전 시작» 을 누른 순간 — 소리를 열고 첫 지령을 내보낸 뒤 시작한다 */
function phoneStart() {
  /* ⚠ armAudio() 만으로는 부족하다 — 그것은 «다음 조작» 을 기다리는 장치라,
     지금 손가락이 닿은 이 탭에는 이미 늦었다. 여기서 audio() 를 직접 불러
     이 손짓 안에서 잠금을 푼다. */
  armAudio();
  try { audio(); } catch (e) {}
  playPhoneVoice("참여감사");        // «참여하신 여러분 감사합니다 …조용히 수행해 주세요»
  startPlay();
}

/* 답을 고르면 곧바로 다음 문제로 넘어간다.
   유형이 바뀌는 자리(연습→객관식→주관식)에서는 구분 화면을 한 장 끼우고,
   마지막 주관식 뒤에는 «끝» 이 아니라 «우리말 모으기» 가 이어진다 —
   무대가 급습·완료까지 가는 동안 관객의 손이 비면 안 되기 때문이다. */
function nextQuestion() {
  if (qi >= QUESTIONS.length - 1) { renderPhoneWait(); return; }
  const was = QUESTIONS[qi].type;
  qi++;
  const n = SECTIONS.findIndex(s => s.type === QUESTIONS[qi].type);
  if (QUESTIONS[qi].type !== was && n >= 0) renderPhoneSection(n);
  else renderPhoneQuestion();
}

/* 선택지 번호. 예전엔 "①②③" 로 3개를 박아 두어, 대본대로 4번째 선택지를
   넣자마자 «undefined 널빤지를…» 로 떴다. 배열 길이를 따라가게 한다. */
const CIRCLED = "①②③④⑤⑥⑦⑧⑨";

/* 사투리로 바꿔야 할 부분(q.mark)에 밑줄을 긋는다. mark가 없으면 문장 그대로. */
function dialectHTML(q) {
  if (!q.mark || !q.dialect.includes(q.mark)) return q.dialect;
  return q.dialect.replace(q.mark, `<u>${q.mark}</u>`);
}

function renderPhoneQuestion() {
  phoneScreen = "quiz";
  const q = QUESTIONS[qi];
  const head = `
    <div class="ph-head">
      <div class="ph-top">문제 ${qi + 1} / ${QUESTIONS.length} · ${q.type}</div>
      <div class="ph-bar"><i style="width:${qi / QUESTIONS.length * 100}%"></i></div>
    </div>`;
  const ask = `
    <div class="ph-q">${q.prompt}</div>
    <div class="ph-d">${dialectHTML(q)}</div>`;

  if (q.type === "주관식") {
    /* 제출 버튼은 하단에 고정한다. 본문에 두면 폰 키보드가 올라올 때 밀려 사라진다. */
    $("phone").innerHTML = head + `
      <div class="ph-body">${ask}` +
        (q.hint ? `<div class="ph-hint"><b>힌트</b>${q.hint}</div>` : "") + `
        <input class="ph-input" id="phInput" placeholder="경상도 사투리로 입력"
               autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="send">
        <div class="ph-warn">답을 입력 후 수정이 어렵습니다.<br>신중히 답해 주시길 바라겠습니다.</div>
      </div>
      <div class="ph-foot"><button class="ph-send" id="phSend">제출 (수정 불가)</button></div>`;
    const submit = () => {
      const v = $("phInput").value.trim().replace(/[.!?]/g, "");
      if (!v) return;
      const hit = v === q.answerText.replace(/[.!?]/g, "");
      sendAnswer(v, hit);
      $("phInput").disabled = true;
      $("phSend").disabled = true;
      $("phSend").textContent = hit ? "정답! ✓" : `정답은 「${q.answerText}」`;
      setTimeout(nextQuestion, 900);
    };
    $("phSend").onclick = submit;
    $("phInput").onkeydown = e => { if (e.key === "Enter") submit(); };
  } else {
    $("phone").innerHTML = head + `
      <div class="ph-body">${ask}
        <div class="ph-opts">${q.options.map((o, i) =>
          `<div class="ph-opt" data-i="${i}"><b>${CIRCLED[i] || i + 1}</b> ${o}</div>`).join("")}</div>
      </div>`;
    let locked = false;
    $("phone").querySelectorAll(".ph-opt").forEach(el => {
      el.onclick = () => {
        if (locked) return;
        locked = true;
        const i = +el.dataset.i, hit = i === q.answer;
        el.classList.add(hit ? "ok" : "no");
        if (!hit) $("phone").querySelector(`.ph-opt[data-i="${q.answer}"]`).classList.add("ok");
        sendAnswer(q.options[i], hit);
        setTimeout(nextQuestion, 750);
      };
    });
  }
}

/* ── 관객 폰: 문제 유형 구분 화면 (2026-08-12 신설) ─────────
   연습 → 객관식 → 주관식 으로 넘어가는 자리에 한 장씩 끼운다. 예전에는
   유형이 바뀌어도 화면 모양이 같아, 관객은 «갑자기 입력칸이 나왔다» 고
   느꼈다. 대본의 «우선 연습문제부터 시작해 볼까요?» 가 놓일 자리이기도 하다.

   ⚠ 자동으로 넘기지 않는다. 관객마다 읽는 속도가 다르고, 무대와 달리 폰은
     각자의 것이다 — 누를 때까지 기다린다.
   ⚠ 화면이 뜨는 순간 그 유형의 첫 문제로 qi 를 옮긴다. 화면만 바꾸고 qi 를
     그대로 두면 «주관식» 이라 써 놓고 객관식이 나온다.
   ⚠ type 문자열은 QUESTIONS 의 type 과 «글자 그대로» 같아야 한다. 다르면
     그 구분 화면은 영영 안 뜨고 문제만 이어진다(조용히 사라지는 종류의 사고). */
const SECTIONS = [
  { type: "연습",   title: "연 습 문 제", btn: "연습문제 시작", voice: "연습시작",
    lead: "먼저 몸을 풀어 봅니다.<br>경상도 말, 얼마나 아십니까?" },
  { type: "객관식", title: "객 관 식",   btn: "객관식 시작",
    lead: "이제부터 진짜 작전입니다.<br>넷 중 하나를 고르세요." },
  { type: "주관식", title: "주 관 식",   btn: "주관식 시작",
    lead: "직접 적어 주십시오.<br>초성 힌트가 함께 나옵니다." },
];

/* SECTIONS[n] 의 유형이 QUESTIONS 에서 처음 나오는 자리 */
function sectionStart(n) {
  const i = QUESTIONS.findIndex(q => q.type === SECTIONS[n].type);
  return i < 0 ? 0 : i;
}

function renderPhoneSection(n) {
  const s = SECTIONS[n];
  if (!s) { renderPhoneQuestion(); return; }
  qi = sectionStart(n);
  $("phone").innerHTML = `
    <div class="ph-head"><div class="ph-top">말모이 작전 · 지령 ${n + 1}</div></div>
    <div class="ph-body ph-sec">
      <div class="sec-title neon">${s.title}</div>
      <div class="sec-lead">${s.lead}</div>
    </div>
    <div class="ph-foot"><button class="ph-send" id="secGo">${s.btn}</button></div>`;
  $("secGo").onclick = () => renderPhoneQuestion();
  if (s.voice) playPhoneVoice(s.voice);
}

/* ── 관객 폰: 우리말 모으기 (폰의 마지막 화면) ───────────────
   주관식이 끝나면 여기로 온다. 보낼 때마다 무대 게이지가 1건씩 오르고,
   그 말이 무대 말풍선에 떠오른다(진행자가 W 로 끌 수 있다).

   ⚠ 끝이 없는 화면이다. 무대가 «작전 성공» 을 알릴 때까지(phoneFinish)
     관객은 계속 보낼 수 있다. 6키 하강으로 떨어진 뒤 관객이 다시
     밀어 올릴 수단이 이것뿐이라, 횟수로 막지 않는다.
   ⚠ 보낸 말을 화면에 그릴 때 innerHTML 을 쓰면 안 된다. 관객이 적어 넣은
     글자를 그대로 태그로 해석해 버린다 — textContent 로만 넣는다. */
let wordsSent = [];

/* ── 관객 폰: 대기 (2026-08-13 신설) ────────────────────────
   주관식 8번을 마치면 여기서 멈춘다. 예전에는 곧장 입력창으로 넘어갔는데,
   그러면 관객마다 도착 시각이 달라 무대가 아직 다른 장면인데 폰만 먼저
   «우리말을 보내라» 고 재촉했다. 지금은 **진행자가 6키를 누를 때** 다 같이
   넘어간다 — 무대와 객석이 같은 박자로 움직인다.

   ⚠ 늦게 접속한 폰은 앞서 나간 신호를 못 본다(접속 시점 이후 신호만 본다).
     그래서 6키는 몇 번이고 다시 눌러 신호를 흘려보낼 수 있게 해 두었다.
     여기 갇힌 폰이 보이면 진행자가 6을 한 번 더 누르면 된다. */
function renderPhoneWait() {
  /* 신호가 이미 지나갔다면 기다릴 이유가 없다 — 바로 입력창으로 */
  if (wordsSignalled) { renderPhoneWords(); return; }
  phoneScreen = "wait";
  $("phone").innerHTML = `
    <div class="ph-head">
      <div class="ph-top">말모이 작전 · 지령 완수</div>
      <div class="ph-bar"><i style="width:100%"></i></div>
    </div>
    <div class="ph-body">
      <div class="ph-done">
        <div class="big">🎖️</div>
        <b style="color:var(--gold);font-size:1.3em">${QUESTIONS.length}문제 모두 응답했습니다</b><br>
        무대 화면을 봐 주세요.<br>
        <span style="font-size:.85em;color:var(--text-faint)">잠시 뒤 마지막 지령이 내려옵니다…</span>
      </div>
    </div>`;
}

function renderPhoneWords() {
  phoneScreen = "words";
  wordsSent = [];
  $("phone").innerHTML = `
    <div class="ph-head">
      <div class="ph-top">말모이 작전 · 마지막 지령</div>
      <div class="ph-bar"><i style="width:100%"></i></div>
    </div>
    <div class="ph-body">
      <div class="ph-q">아름다운 우리말을 입력해 힘을 모아 주세요.</div>
      <div class="wd-lead">
        여러분이 보낸 말이 <b>무대 화면</b>에 떠오르고<br>
        원고 복원율이 그만큼 올라갑니다.<br>
        <span>몇 번이든 보낼 수 있습니다</span>
      </div>
      <div class="wd-sent" id="wdSent"></div>
    </div>
    <div class="ph-foot">
      <input class="ph-input" id="wdInput" placeholder="예) 사랑 · 어무이 · 하늘"
             maxlength="${WORD_MAX}" autocomplete="off" autocapitalize="off"
             autocorrect="off" enterkeyhint="send">
      <button class="ph-send" id="wdSend">보내기</button>
    </div>`;

  const send = () => {
    const el = $("wdInput");
    const v = el.value.trim().replace(/\s+/g, " ").slice(0, WORD_MAX);
    if (!v) return;
    sendAnswer(v, true, QI_WORD);
    wordsSent.unshift(v);
    el.value = "";
    paintWords();
    /* 키보드를 내리지 않는다 — 연달아 보내는 사람이 매번 다시 눌러야 한다 */
    el.focus();
  };
  $("wdSend").onclick = send;
  $("wdInput").onkeydown = e => { if (e.key === "Enter") send(); };

  paintWords();
  /* «비밀요원» 은 여기가 아니라 100% 달성(phoneFinish)에서 난다 — 2026-08-13 */
}

function paintWords() {
  const box = $("wdSent");
  if (!box) return;
  box.innerHTML = "";
  if (!wordsSent.length) return;
  const cap = document.createElement("div");
  cap.className = "wd-cap";
  cap.textContent = `보낸 말 ${wordsSent.length}개 — 고맙습니데이!`;
  box.appendChild(cap);
  /* 최근 것부터 열두 개만. 다 쌓으면 폰이 길어져 입력칸이 밀린다 */
  wordsSent.slice(0, 12).forEach(w => {
    const chip = document.createElement("span");
    chip.className = "wd-chip";
    chip.textContent = w;              // ⚠ innerHTML 금지 (위 설명)
    box.appendChild(chip);
  });
}

/* ── 관객 폰: 무대가 보내는 신호를 기다린다 ─────────────────
   3초마다 신호 행이 생겼는지만 본다. 폰이 수백 대라 자주 물으면 부담이 되고,
   1~2초 늦어도 관객은 무대를 보고 있으므로 티가 나지 않는다.
   실패해도 조용히 넘어간다 — 퀴즈 진행을 막으면 안 된다.

   신호는 둘이다.
     QI_WORDS  (-2)  진행자 6키 — 마지막 지령. 대기 화면 → 우리말 입력창
     QI_FINISH (-1)  진행자 0키 — 작전 성공. 어느 화면이든 엔딩으로

   ⚠ 신호 행은 테이블에 그대로 남는다. 기준선 없이 «신호가 있나» 만 물으면
     지난 회차(리허설 포함)에 눌러 둔 키 때문에 접속하자마자 건너뛴다.
     그래서 접속 시점의 마지막 id 를 기준선으로 잡고 «그보다 새로운» 신호에만
     반응한다. 옛 신호는 그대로 있어도 무해해진다.
   ⚠ 그 대가로 **신호가 나간 뒤에 접속한 폰은 그 신호를 못 본다.** 6키를 여러
     번 눌러 쓸 수 있게 해 둔 것이 이 구멍을 메우는 유일한 수단이다. */
let phoneWatcher = null;
let sinceId = 0;              // 이 폰이 접속한 시점의 마지막 응답 id

async function watchFinish() {
  if (!LIVE || phoneWatcher) return;
  try {
    const r = await db(`answers?session=eq.${SESSION}&select=id&order=id.desc&limit=1`);
    const rows = await r.json();
    sinceId = rows.length ? rows[0].id : 0;
  } catch (e) {
    /* 기준선을 못 잡았는데 감시를 시작하면 옛 신호에 걸린다. 잠시 뒤 다시 시도한다. */
    setTimeout(watchFinish, 3000);
    return;
  }
  phoneWatcher = setInterval(async () => {
    try {
      /* 두 신호를 한 번에 물어 온다 — 폰 수백 대가 3초마다 두 번씩 두드리면
         그만큼 부담이 두 배가 된다. */
      const r = await db(`answers?session=eq.${SESSION}&qi=lt.0&id=gt.${sinceId}` +
                         `&select=id,qi&order=id.asc&limit=20`);
      const rows = await r.json();
      for (const row of rows) {
        if (row.qi === QI_FINISH) { phoneFinish(); return; }   // 엔딩이 우선이다
        if (row.qi === QI_WORDS)  phoneToWords();
      }
    } catch (e) { /* 다음 차례에 다시 본다 */ }
  }, 3000);
}

/* 6키 신호를 받았다 — 마지막 지령으로 넘어간다.
   ⚠ 아직 퀴즈를 풀고 있는 폰은 그 자리에서 건드리지 않는다. 문제를 푸는 중에
     화면이 통째로 바뀌면 그 사람의 응답 하나가 사라지고, 무엇보다 놀란다.
   ⚠ 대신 «신호가 이미 나갔다» 를 기억해 둔다(wordsSignalled). 늦게 푼 사람이
     대기 화면에 닿는 순간 곧바로 입력창으로 보낸다 — 진행자가 6을 다시
     눌러 주지 않아도 된다. 이것이 없으면 느린 관객이 영영 대기에 갇힌다. */
let wordsSignalled = false;
let phoneScreen = "";           // lobby | quiz | wait | words | end

function phoneToWords() {
  if (phase === "end") return;
  wordsSignalled = true;
  if (phoneScreen === "wait") renderPhoneWords();
}

/* 무대와 같은 «작전 완료» 화면 + 축포.
   소리는 내지 않는다 — 폰 수백 대가 동시에 울리면 객석이 소란해지고,
   그 순간 관객이 봐야 할 것은 무대다. */
function phoneFinish() {
  if (phase === "end") return;
  phoneScreen = "end";                     // 두 번 터지지 않게
  phase = "end";
  if (phoneWatcher) { clearInterval(phoneWatcher); phoneWatcher = null; }
  /* 흐르던 지령을 끊는다 — 작전이 끝난 화면 위로 앞의 말이 계속 흐르면 사고다 */
  if (phoneVoiceNow) { try { phoneVoiceNow.pause(); } catch (e) {} phoneVoiceNow = null; }
  $("phone").innerHTML = `
    <div class="ph-head"><div class="ph-top">말모이 작전 · 완료</div></div>
    <div class="ph-body">
      <div class="ph-done">
        <div class="big">🏮</div>
        <b style="color:var(--gold);font-size:1.5em">작전 성공!</b><br>
        말모이 원고를 <b style="color:var(--gold)">100%</b> 되찾았습니다.<br>
        여러분의 입이 원고를 전부 되살렸습니다.<br>
        <span style="font-size:.85em;color:var(--text-faint)">고맙습니데이~<br>무대 화면을 봐 주세요</span>
      </div>
    </div>`;
  confetti();
  /* 무대의 «축하드립니다» 와 같은 순간이다. 무대는 축포 0.7초 뒤,
     폰은 여기서 — 둘이 나란히 간다. */
  playPhoneVoice("비밀요원");        // «당신은 진정한 비밀요원입니다»
}

/* ⚠ 「내 몫은 끝」 화면(renderPhoneDone)은 2026-08-12 에 없앴다. 폰의 마지막은
   이제 «우리말 모으기» 이고, 그 화면은 무대가 작전 성공을 알릴 때까지
   끝나지 않는다(phoneFinish 가 덮는다). 관객의 손을 먼저 놓아 주지 않는다. */

/* ── 무대 스크린 클릭 = 시작 → 종료 → 리셋 ───────────────
   클릭 한 번에 한 단계씩. 진행자가 리듬을 통제할 수 있어야 하므로
   조건으로 막지 않는다. 정밀 조작은 숫자키(7/9/0/A)로 한다.

   ⚠ Q-Studio 임베드에서는 아예 붙이지 않는다. iframe 안의 클릭·키가 살아
   있으면 조종창이 세는 단계와 화면이 어긋나고(Q-Studio README 수정이력 #33),
   무엇보다 Space를 삼켜 GO(다음 큐)가 먹통이 된다 — 공연 중 큐에 갇힌다. */
/* 한 단계 진행. 예전에는 화면 클릭에 묶여 있었으나 지금은 키보드 전용이다.
   ⚠ 무대 화면에서 마우스는 아무것도 하지 않는다. 무대 PC 를 잘못 클릭하면
     단계가 튀어 조종창과 어긋나기 때문이다. 단계는 Q-Studio 의 ← → 와
     Space/Enter 로만 넘긴다.
   ⚠ 소리 잠금 해제는 armAudio() 가 pointerdown 으로 따로 받는다. 그래서
     클릭을 막아도 첫 클릭에 소리는 정상적으로 열린다. */
function advance() {
  if (PHONE_ONLY) return;
  if (phase === "end") { location.reload(); return; }
  /* ⚠ 2026-08-12 — 예전에는 여기서 phase·clickStep 을 보고 직접 다음 장면을
     불렀다. 타이틀이 0단계로 들어오면서 «로비를 건너뛰고 진행 화면» 으로
     튀었다. 단계 계산은 applyStep 한 곳에만 두고 여기서는 한 칸 민다. */
  applyStep(curStep + 1);
}

/* 진행자 키 — Q-Studio 안에서도 살아 있어야 한다.
   집계가 끊기면 «1» 을 눌러 손으로 게이지를 올리며 공연을 이어 가는데,
   예전에는 삽입 상태에서 이 핸들러를 통째로 달지 않아 그 비상 수단이 죽어 있었다.

   ⚠ 출력창에는 포커스가 없어 키가 직접 오지 않는다. 아래 cueoutKeys 선언을 보고
      조종창이 그 키만 프레임 안으로 넣어 준다.
   ⚠ Space·Enter 는 «혼자 열었을 때» 만 받는다. Q-Studio 안에서 Space 를 가져가면
      GO 가 먹통이 되어 공연 중 큐에 갇힌다. 그래서 cueoutKeys 에도 넣지 않는다. */
/* ⚠ 여기에 없는 키는 Q-Studio 안에서 «아무 반응이 없다». 핸들러가 멀쩡해도
     조종창이 그 키를 프레임에 넣어 주지 않기 때문이다. 실제로 «-» 를 빠뜨려
     10% 감소가 무대에서만 먹통이었다(2026-08-12). 키를 늘리면 여기도 늘린다. */
window.cueoutKeys = ["1", "5", "6", "7", "-", "9", "0", "a", "A", "h", "H", "w", "W"];

document.body.onkeydown = e => {
  if (PHONE_ONLY) return;                          // 관객이 연출을 건드리면 안 된다
  if (e.target.tagName === "INPUT") return;        // 주관식 입력의 Enter까지 삼키면 안 된다
  const k = e.key;
  /* 게이지 조작은 «작전 진행» 화면에서만 뜻이 있다. 로비·타이틀에서 눌렀다면
     진행 화면부터 세워 준다 — 예전에는 조용히 무시해서 «키가 안 먹는다» 고
     읽혔다. applyStep 을 거치므로 조종창이 세는 단계와도 어긋나지 않는다.
     ⚠ 2026-08-12 에 타이틀이 0단계로 들어와 «작전 진행» 이 1 → 2 가 됐다. */
  const onGauge = fn => { if (phase !== "play") applyStep(2); if (phase === "play") fn(); };
  if (!EMBEDDED && (e.code === "Space" || e.code === "Enter")) { e.preventDefault(); advance(); }
  else if (k === "1") { onGauge(bumpOne); }                      // 의견 1건 — +1%
  /* 5 — 경고. 게이지는 건드리지 않는다. 몇 번이고 다시 눌러 쓴다(warnFlash) */
  else if (k === "5") { onGauge(warnFlash); }
  /* 6 — 우리말 모으기 개시. 무대는 빙고판으로, 관객 폰은 입력창으로 넘어간다.
         늦게 접속한 폰을 주우려면 한 번 더 누른다(신호만 다시 나간다) */
  else if (k === "6") { openWords(); }
  else if (k === "7") { onGauge(() => pinPct(70)); }             // 70% 로 이동
  else if (k === "-") { onGauge(stepDown); }                     // 10%씩 감소
  else if (k === "9") { onGauge(() => { pinPct(90); keyVoice("9"); }); }  // 90% 고정 + 안내 맨트
  else if (k === "0") { onGauge(() => pinPct(100)); }            // 100% 달성 → 엔딩
  else if (k === "a" || k === "A") { onGauge(autoPct); }         // 개입 해제
  else if (k === "h" || k === "H") { $("opbar").classList.toggle("off"); }
  /* W — 관객이 보낸 우리말을 무대에 띄울지 끈다. 익명 접속이라 무엇이 올지
     막을 수 없고, 공개 상연 중 이상한 말이 무대에 뜨면 되돌릴 방법이 없다.
     그때 누를 자리다(눌러도 게이지는 계속 오른다). 필요 없으면 지워도 된다. */
  else if (k === "w" || k === "W") { showWords = !showWords; showOpBar(); }
};

setText("hint", "");

startLobby();

/* ══════════════════════ Q-Studio 단계 규약 ══════════════════════
   window.cueoutSteps   총 단계 수
   window.cueoutStart() 큐가 화면에 떴을 때
   window.cueoutStep(i) i번째 단계로 (0부터)

   조종창이 ← → 로 단계를 넘긴다. Space(GO)는 단계를 먹지 않고 언제나
   다음 큐로 간다 — 스페이스가 큐마다 다른 일을 하면 무대에서 예측할 수 없다.

   그래서 진행자 미세 조작(9 = 90% 고정 · 0 = 100% · A = 개입 해제)은 여기에
   없다. 그 조작이 필요한 공연이면 이 페이지를 Q-Studio 밖 브라우저 창으로
   직접 열어야 한다.

   ⚠ 되감기(←)도 같은 cueoutStep을 «절대 위치»로 부른다(app.js의 driveFrame).
   그래서 어느 단계에서 어느 단계로든 화면을 다시 세울 수 있어야 한다. */
/* ⚠ 2026-08-12 — 맨 앞에 «타이틀» 이 들어와 4단계에서 5단계가 됐다.
   큐 #36 의 [내부 단계] 도 **5** 로 맞춰야 한다. 그대로 4로 두면 마지막
   «작전 완료» 로 넘어가지 못한 채 큐가 끝난다. 인스펙터 [다시 감지] 로도 된다. */
/* ⚠ 2026-08-13 — 하강은 단계가 아니다. 진행자가 6키로
   부르는 «수동 조작» 이 됐다. 단계는 화면이 바뀌는 자리만 남긴다. */
const STEP_NAMES = ["타이틀", "로비(QR)", "작전 진행", "작전 완료"];
let curStep = -1;

/* 0단계(로비) 상태로 되돌린다.
   ⚠ answered · joined · lastId는 일부러 건드리지 않는다. 실집계는 계속
   흐르는 값이고, lastId를 그대로 둔 채 answered만 0으로 되돌리면 이미 읽어
   간 응답을 다시 셀 수 없어 게이지가 0에서 영영 멈춘다. */
function resetStage() {
  clearTimers();
  /* 흐르던 안내 음성을 즉시 끊는다 — 앞 단계의 말이 되감긴 화면 위로 계속
     흐르면 사고다. 기록도 지운다: 장면을 처음부터 다시 세우는 것이므로
     안내도 다시 나가야 화면과 말이 맞는다(위 «안내 음성 재생» 규칙 3). */
  stopVoice();
  voiceDone.clear();
  finishSignalled = false;   // 되감아 다시 끝내면 폰에도 다시 알린다
  /* 우리말 모으기도 처음으로 되돌린다 — 되감아 다시 6키를 누르면 판이 새로
     섞여 나온다. 켜진 칸을 그대로 두면 되감은 화면에 지난 회차가 남는다. */
  wordsOpened = false; litCells.clear(); bingoTiles = [];
  $("swBoard").innerHTML = ""; $("swWall").innerHTML = "";
  phase = "lobby"; anchor = null; pinned = null; clickStep = 0;
  showPane("title");                      // 0단계 = 타이틀
  $("joinBox").style.display = "none";    // 타이틀에는 접속 인원도 없다
  $("counter").textContent = "";
  $("gaugeMsg").textContent = "관객의 응답을 기다리는 중…";
  $("bubbles").innerHTML = "";
  $("confetti").innerHTML = "";
  $("verdict").className = "verdict";
  $("gaugeFill").classList.remove("drop");
  paintGauge();
  drawQR();
  if (LIVE && !poller) { poll(); startPolling(); }   // finish()가 세운 폴링을 되살린다
  showOpBar();
}

function applyStep(i) {
  i = Math.max(0, Math.min(i | 0, STEP_NAMES.length - 1));
  if (i === curStep) return;                         // 같은 단계 — 안내가 두 번 울리지 않는다
  stopVoice();                                       // 넘어가는 순간 앞 안내를 끊는다
  if (i < curStep) { resetStage(); curStep = 0; }    // 되감기 — 0단계부터 다시 세운다
  /* 여러 단계를 한 번에 지나갈 때(예: 3 → 2 되감기는 0 → 1 → 2 로 다시 세운다)
     지나치는 단계의 안내까지 울리면 말이 겹친다. 도착한 단계의 것만 낸다. */
  voiceMute = true;
  try {
    while (curStep < i) {
      switch (++curStep) {
        case 1: showLobby();                break;   // 타이틀 → 로비(QR)
        case 2: clickStep = 1; startPlay(); break;
        case 3: finish();                   break;   // 급습은 단계가 아니다 — 6키
      }
    }
  } finally {
    voiceMute = false;
  }
  stepVoice(curStep);
}

/* 1단계 — 타이틀을 걷고 QR·접속 인원을 세운다.
   QR 은 여기서 다시 그린다. 타이틀 동안 숨겨 둔 상자는 크기가 0 이라,
   그 상태로 그린 QR 은 눈에 보이지 않는다. */
function showLobby() {
  showPane("lobby");
  $("joinBox").style.display = "";
  drawQR();
}

if (!PHONE_ONLY) {
  window.cueoutSteps = STEP_NAMES.length;
  window.cueoutStart = () => { resetStage(); curStep = 0; };
  window.cueoutStep  = applyStep;
}
</script>
</body>
</html>
