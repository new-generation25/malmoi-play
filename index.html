<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 관객은 참여퀴즈창(?p=1)에 폰으로 들어온다. 이 줄이 없으면 폰이 문서를
     데스크톱 폭(980px)으로 렌더한 뒤 통째로 축소해서, 글씨를 아무리 키워도
     작게 보인다. viewport-fit=cover 는 노치 단말에서 화면을 끝까지 쓰기 위한 것. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="var(--surface)">
<title>말모이 작전 — 관객참여 퀴즈 데모</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* ===== 밝은 테마 — 핑크 + 밝은 하늘색 =====
     메인퀴즈창·참여퀴즈창이 같은 색을 쓴다. 색은 전부 여기서만 정하고
     아래에서는 변수만 부른다 — 한 곳을 고치면 두 화면이 같이 바뀐다. */
  :root {
    /* ── 네온 퀴즈쇼 팔레트 (2026-08-12) ───────────────────
       무대 마키 간판을 옮겼다 — 딥 퍼플 객석 · 시안 사인보드 ·
       마젠타 네온 글자 · 골드 전구. 어두운 바탕이라 무대 프로젝터에서
       빛이 새지 않고, 네온만 떠오른다.
       ⚠ 이 블록이 두 화면(무대·관객 폰)의 색을 모두 정한다. */
    /* ── 다섯 색 ──────────────────────────────────────────
       간판 이미지에서 뽑았다. 이 다섯 밖의 색은 쓰지 않는다 —
       무대에서 색이 늘어나면 그만큼 «퀴즈쇼 간판» 이 아니게 된다.

         1 마젠타  #ff3d9a  네온 글자 · 제목 · 복원율 숫자   (주인공)
         2 시안    #22e0f0  사인보드 · 테두리 · 접속 바      (판을 이루는 색)
         3 골드    #ffd34d  마키 전구 · 하이라이트 · 축포
         4 보라    #7b3ff2  객석 조명 · 바깥 발광 · 폰 테두리
         5 화이트  #ffffff  글자 (간판의 SQUAZ 로고 자리)

       배경의 남색(#1b1150·#071834)은 «색» 이라기보다 무대 어둠이다. */
    --magenta: #ff3d9a;
    --cyan:    #22e0f0;
    --bulb:    #ffd34d;
    --violet:  #7b3ff2;

    /* 아래는 옛 이름 유지 — 이미 쓰이는 곳이 많아 이름만 남기고 값을 잇는다 */
    --gold: var(--magenta);    /* 주색 — 제목·숫자·강조 */
    --gold-dim: #b52e70;
    --gold-lite: var(--bulb);  /* 하이라이트·반짝임 */
    --accent2: var(--cyan);    /* 보조색 — 게이지 아랫단·접속 바 */
    --glow: 255, 61, 154;      /* rgba() 로 쓰는 발광색(마젠타) */
    --glow-lite: 255, 211, 77; /* 응답 도착 때 확 밝아지는 색(전구 골드) */
    --glow-violet: 123, 63, 242;

    --bg1: #1b1150;            /* 바탕 — 위쪽 보라 조명 */
    --bg2: #071834;            /* 바탕 — 아래쪽 심야 청색 */
    --panel: #0b1c3c;          /* 무대 판 — 짙은 남색. 네온이 뜨는 «벽» */
    --surface: #0e2347;        /* 카드·폰·입력칸 */
    --surface-2: #091a38;      /* 살짝 눌린 면 */
    --line: #1c86a8;           /* 테두리 — 시안 */
    --line-2: #ff3d9a;         /* 강조 테두리(네온 마젠타) */

    /* ⚠ 보조 글자를 회청색(#a9b8dd·#7385b2)으로 뒀더니 시안 판 위에서
       뿌옇게 묻혔다. 판이 청록이라 «푸른 회색» 은 배경과 같은 계열이 되어
       대비가 죽는다. 흰쪽으로 끌어올리고 채도를 낮춰 또렷하게 만든다. */
    --text: #ffffff;           /* 본문 */
    --text-dim: #d6ecf7;       /* 보조 — 거의 흰색 */
    --text-faint: #a6cbdc;     /* 더 흐림 — 그래도 읽히는 선까지만 */
    --on-accent: #12082a;      /* 네온 위에 얹는 글자 — 어둡게 눌러야 읽힌다 */

    --ink: #eaf2ff;            /* 옛 이름 유지 */
    --paper: #eaf2ff;          /* 옛 이름 유지 — 본문 글자 */
    --red: #ff5c5c;
    --green: #3ce8a0;
  }
  body {
    font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif;
    /* 네온사인은 «어두운 벽 + 빛나는 관» 이다. 바탕에 그라데이션을 깔면
       벽이 스스로 빛나 보여 네온이 죽는다. 단색으로 눌러 둔다. */
    background: var(--bg2);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px;
    user-select: none;
    overflow-x: hidden;
  }
  .wrap { width: 100%; max-width: 1400px; display: flex; gap: 20px; align-items: stretch; }

  /* ===== 무대 스크린 ===== */
  /* 무대 판 = 퀴즈쇼 마키 간판.
     시안 사인보드에 골드 전구를 둘러 박은 모양이다. 전구는 ::before 하나로
     그린다 — 알맹이를 수십 개 만들면 무대 렌더링만 무거워지고, 이 판은
     공연 내내 떠 있다. 안쪽 테두리(::after)가 전구와 내용 사이를 갈라
     간판다운 «두 겹» 을 만든다. */
  .screen {
    flex: 1;
    /* B안 — 순수 네온관. 전구와 시안 판을 버리고 «어두운 벽 + 빛나는 관» 만
       남긴다. 어둠이 넓어 프로젝터 빛샘이 가장 적고, 객석 조명이 밝아도
       네온이 살아남는다. */
    background: var(--panel);
    border: 3px solid var(--magenta);
    border-radius: 22px;
    padding: 5vh 6vw;
    display: flex;
    flex-direction: column;
    min-height: 640px;
    position: relative;
    overflow: hidden;
    cursor: default;                          /* 마우스로는 아무것도 하지 않는다 */
    box-shadow:
      0 0 14px rgba(var(--glow),.9),
      0 0 46px rgba(var(--glow),.45),
      inset 0 0 34px rgba(var(--glow),.14);
  }
  /* 안쪽 시안 관 한 겹 — 두 색이 겹쳐야 «네온사인» 으로 읽힌다 */
  .screen::after {
    content: ""; position: absolute; inset: 13px; border-radius: 13px;
    border: 2px solid var(--cyan);
    box-shadow: 0 0 12px rgba(34,224,240,.85), inset 0 0 20px rgba(34,224,240,.16);
    pointer-events: none; z-index: 2;
  }
  .screen-label {
    position: absolute; top: 44px; right: 84px;   /* 전구 안쪽으로 */
    font-size: 15px; letter-spacing: 2px; color: var(--text-faint);
  }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  /* ── 네온사인 글자 ────────────────────────────────────────
     진짜 네온은 «관 속의 빛» 이 거의 흰색이고, 관 유리와 주변 공기가
     색으로 물든다. 그래서 글자 속을 흰색으로 두고 테두리에 색을 입힌 뒤
     바깥으로 번지게 한다.
     ⚠ 색 글자에 같은 색 그림자만 겹치면 «뿌연 색 덩어리» 가 된다.
       실제로 그렇게 만들었다가 대비 2.74 로 무대에서 읽히지 않았다.
       흰 심을 남기는 이 방식은 대비가 16 을 넘는다.
     ⚠ 번짐을 크게 주면 «빛나 보이는» 게 아니라 그냥 뿌예진다. 42px·80px
       레이어를 넣었다가 글자가 안개처럼 보였다. 번짐은 «짧고 진하게» —
       심에 붙는 4px 로 관을 만들고, 14px 한 겹으로 공기만 물들인다. */
  .neon {
    color: #fff;
    -webkit-text-stroke: 2px var(--magenta);
    paint-order: stroke fill;                 /* 테두리를 글자 뒤로 — 획이 얇아지지 않는다 */
    text-shadow:
      0 0 4px  rgba(var(--glow),1),
      0 0 14px rgba(var(--glow),.75);
  }
  .neon.cyan {
    -webkit-text-stroke-color: var(--cyan);
    text-shadow:
      0 0 4px  rgba(34,224,240,1),
      0 0 14px rgba(34,224,240,.75);
  }

  .title { font-size: 26px; letter-spacing: 4px; font-weight: 800; }
  .counter { font-size: 19px; color: var(--text-dim); }

  /* 접속 인원 */
  /* 위아래로 넉넉히 띄운다 — 접속 인원은 로비에서 관객이 «늘어나는 것을
     지켜보는» 줄이라, 다른 요소에 붙어 있으면 그 변화가 눈에 안 들어온다. */
  .join { display: flex; align-items: center; gap: 26px; margin: 34px 0 30px; }
  .join-num { font-size: 21px; color: var(--text-dim); white-space: nowrap; letter-spacing: 1px; }
  .join-num b { color: var(--gold); font-size: 36px; margin: 0 6px; }
  .join-track { flex: 1; height: 8px; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .join-fill {
    height: 100%; width: 0%; border-radius: 5px;
    background: var(--cyan);                  /* 단색 시안관 */
    box-shadow: 0 0 16px rgba(34,224,240,.9);
    transition: width .25s ease-out;
  }
  .join-num b { text-shadow: 0 0 14px rgba(var(--glow),.8); }

  /* 로비 */
  .lobby { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; }
  /* 간판 글자 — 마젠타 네온에 시안 링이 둘린다(이미지의 «세상을 바꿀» 글자) */
  .lobby h1 {
    font-size: 66px; letter-spacing: 6px; font-weight: 800;
  }
  .lobby p { color: var(--text-dim); line-height: 1.75; font-size: 23px; }
  /* 0단계 타이틀 — 로비 제목보다 크게. 이 화면에는 이것뿐이라 무대에서
     작아 보이면 «화면이 안 켜졌나» 로 읽힌다. 크기는 vh 다(4:3 대응, 10-3). */
  .lobby h1.title-big { font-size: 92px; }
  .title-sub { color: var(--cyan); font-size: 26px; letter-spacing: 6px; }
  .qr-box { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 0 46px rgba(255,211,77,.45); }
  .qr-url { font-size: 18px; color: var(--gold); letter-spacing: 1px; }

  /* 단계 전환 — 툭 갈리지 않게 흐려졌다 떠오른다.
     ⚠ 두 화면을 «겹쳐서» 넘기지 않는다. 넷 다 .screen 의 flex 자식이라
       동시에 보이면 세로 공간을 나눠 가지며 레이아웃이 튄다. 그래서
       나가는 화면을 다 지운 뒤에 들어오는 화면을 띄우는 순차 방식이다. */
  #title, #lobby, #done, #stage { transition: opacity .22s ease; }

  /* ===== 복원율 게이지 무대 ===== */
  .stage { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
  /* 게이지 기둥은 무대 한가운데에 세운다. 말풍선은 그 뒤로 깔려 떠오른다. */
  .gauge-col {
    position: relative; z-index: 1; flex: 1;
    display: flex; flex-direction: column; align-items: center; min-height: 0;
  }

  /* 응답이 떠오르는 영역 — 무대 전체를 뒷배경으로 쓴다.
     ⚠ 여기에 «답»을 절대 적지 않는다. 관객마다 푸는 속도가 달라서, 무대에
     정답 글자가 떠 있으면 아직 못 푼 사람이 무대만 보고 답을 알아 버린다.
     응답이 «도착했다»는 사실만 빛 알갱이로 보여준다. */
  /* ===== 우리말 모으기 — 무대 (2026-08-13) =====
     왼쪽 빙고판 · 오른쪽 낱말 벽. 4:3 스크린에서 세로가 넉넉하므로 좌우로
     갈라 둘 다 크게 보여준다. 크기는 전부 vh 다 — 프로젝터 해상도가 바뀌어도
     비율이 유지되어야 한다(10-3 규칙). */
  .words { flex: 1; display: flex; gap: 3vh; align-items: stretch; min-height: 0; }
  .sw-left  { flex: 0 0 46%; display: flex; flex-direction: column; gap: 1.6vh; min-height: 0; }
  .sw-right { flex: 1; display: flex; flex-direction: column; gap: 1.6vh; min-height: 0; }
  .sw-cap { font-size: 2.6vh; letter-spacing: .5vh; text-align: center; }
  .sw-board {
    flex: 1; display: grid; grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: 1fr; gap: .8vh; min-height: 0;
  }
  /* 아직 안 켜진 칸 — 꺼진 네온관처럼 어둡게 두되 «칸이 있다» 는 것은 보이게 */
  .sw-cell {
    display: flex; align-items: center; justify-content: center;
    border: .2vh solid rgba(28,134,168,.55); border-radius: .9vh;
    background: rgba(0,0,0,.28); color: rgba(214,236,247,.30);
    font-size: 3.4vh; font-weight: 700; transition: all .35s ease;
  }
  /* 켜진 칸 — 관객이 보낸 말에 그 글자가 들어 있었다 */
  .sw-cell.lit {
    color: var(--on-accent); background: var(--gold); border-color: var(--gold);
    box-shadow: 0 0 2.4vh rgba(var(--glow),.75);
  }
  .sw-cell.just { animation: wdpop .5s ease; }
  @keyframes wdpop { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
  /* 사석 — 어느 낱말에도 없는 글자라 영영 켜지지 않는다. 더 어둡게 눌러 둔다 */
  .sw-cell.dead { opacity: .34; }
  .sw-count { font-size: 2.2vh; color: var(--text-faint); text-align: center; }
  .sw-count b { color: var(--gold); font-size: 3vh; }
  /* 낱말 벽 — 새 말이 위에서 내려와 쌓인다. 넘치면 아래로 흘러 사라진다 */
  .sw-wall {
    flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start;
    gap: .9vh; overflow: hidden; min-height: 0; padding: .4vh;
  }
  .sw-word {
    font-size: 2.8vh; font-weight: 700; padding: .8vh 1.6vh; border-radius: 99vh;
    background: rgba(34,224,240,.16); border: .2vh solid var(--cyan); color: var(--text);
    animation: wdin .45s ease both;
  }
  @keyframes wdin { from { opacity: 0; transform: translateY(-1.6vh) scale(.9); } to { opacity: 1; transform: none; } }
  /* 판을 켠 말은 마젠타로 — «이 말이 글자를 되찾았다» */
  .sw-word.hit { background: rgba(var(--glow),.20); border-color: var(--gold); }

  .bubble-field { position: absolute; inset: 0; overflow: hidden; }
  .bubble {
    position: absolute; bottom: 0;
    width: 15px; height: 15px; border-radius: 50%;
    background: rgba(34,224,240,.30);        /* 오답 — 시안 알갱이 */
    border: 1px solid rgba(34,224,240,.65);
    box-shadow: 0 0 16px rgba(34,224,240,.5);
    animation: rise 2.6s ease-out forwards;
    pointer-events: none;
  }
  .bubble.hit {
    background: rgba(var(--glow),.55); border-color: var(--gold);
    box-shadow: 0 0 22px rgba(var(--glow),.75);
  }
  /* 관객이 보낸 «아름다운 우리말» — 알갱이가 아니라 글자가 떠오른다.
     퀴즈 답은 여기로 오지 않는다(popBubble 설명 참고).
     ⚠ 알갱이용 15px 고정 폭을 풀지 않으면 글자가 한 자씩 세로로 쌓인다. */
  .bubble.word {
    width: auto; height: auto; border-radius: 999px;
    padding: 6px 14px; white-space: nowrap;
    font-size: 20px; font-weight: 700; color: var(--text);
    background: rgba(var(--glow),.28); border-color: var(--gold);
    box-shadow: 0 0 22px rgba(var(--glow),.6);
    /* 왼쪽 끝에서 뜬 말이 화면 밖으로 삐져나가지 않게 기준점을 글자 가운데로 */
    transform-origin: center bottom;
  }
  @keyframes rise {
    0%   { transform: translateY(0) scale(.4); opacity: 0; }
    14%  { transform: translateY(-14px) scale(1.12); opacity: 1; }
    24%  { transform: translateY(-24px) scale(1); opacity: 1; }
    100% { transform: translateY(-190px) scale(.9); opacity: 0; }
  }

  /* 큰 복원율 숫자 */
  .pct-row { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin-bottom: 4px; }
  .pct {
    font-size: 128px; font-weight: 800; line-height: 1;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
  }
  .pct-unit { font-size: 44px; font-weight: 700; color: var(--gold-lite); padding-bottom: 12px; }
  /* 무대 한가운데의 설명 줄이다. 객석 뒤쪽에서도 읽히도록 크게 세운다. */
  .pct-cap { text-align: center; font-size: 40px; font-weight: 700; color: var(--text-dim); letter-spacing: 4px; margin-bottom: 18px; }

  /* 메인 게이지 — 세로 기둥. 원고가 «차오르는» 것으로 읽히도록 아래에서 위로 찬다.
     말풍선도 아래에서 떠오르므로 방향이 같아 무대에서 한 덩어리로 보인다. */
  .gauge {
    position: relative; flex: 1; min-height: 190px; width: 100%;
    display: flex; align-items: stretch; justify-content: center;
    padding-top: 0;
  }
  /* 눈금은 흐름에서 빼서 절대 배치한다. 흐름에 두면 그 폭만큼 기둥이
     오른쪽으로 밀려, 화면 한가운데에 서지 않는다. */
  .gauge-scale {
    position: absolute; top: 20px; bottom: 0; right: calc(50% + 56px);
    display: flex; flex-direction: column; justify-content: space-between;
    font-size: 16px; color: var(--text-faint); letter-spacing: 1px; text-align: right;
  }
  .gauge-bar { position: relative; width: 88px; flex: 0 0 88px; }
  .gauge-track {
    position: absolute; inset: 0;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 44px; overflow: hidden;
    display: flex; align-items: flex-end;    /* 채움을 바닥에 붙인다 */
  }
  .gauge-fill {
    width: 100%; height: 0%; border-radius: 44px;
    /* 핑크 네온관 하나. 시안→핑크→골드로 섞던 것을 걷어냈다 —
       색이 섞이면 «얼마나 찼는지» 보다 «무슨 색인지» 가 먼저 읽힌다. */
    background: var(--magenta);
    box-shadow: 0 0 26px rgba(var(--glow),.9), 0 0 70px rgba(var(--glow),.55);
    transition: height .5s cubic-bezier(.34,1.3,.64,1), background .3s;
    position: relative;
  }
  .gauge-fill::after {                        /* 수면 하이라이트 */
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: #fff; opacity: .85; box-shadow: 0 0 14px #fff;
  }
  .gauge-fill.drop { background: linear-gradient(0deg, #ffb3a8, var(--red)); box-shadow: 0 0 30px rgba(216,72,63,.6); }
  /* 응답 1건이 도착할 때마다 기둥이 «출렁» 한다. 게이지가 조금씩 오르는 것만으로는
     멀리서 변화가 안 보여, 도착 자체를 눈에 띄게 만든다. */
  @keyframes surge {
    0%   { box-shadow: 0 0 30px rgba(var(--glow),.55); }
    30%  { box-shadow: 0 0 70px rgba(var(--glow-lite),.95); }
    100% { box-shadow: 0 0 30px rgba(var(--glow),.55); }
  }
  .gauge-fill.surge { animation: surge .45s ease-out; }
  @keyframes bump { 0% { transform: none; } 30% { transform: scale(1.09); } 100% { transform: none; } }
  .pct.bump { animation: bump .35s ease-out; }
  .gauge-legend { text-align: center; font-size: 18px; color: var(--text-dim); margin-top: 14px; letter-spacing: 1px; }

  /* 하단 */
  .hint { text-align: center; font-size: 17px; color: var(--text-faint); margin-top: 16px; letter-spacing: 1px; }
  .verdict {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    /* ⚠ 예전엔 흰 판(rgba(255,255,255,.9))으로 덮었다. 밝은 테마의 잔재라
       어두운 무대에서는 화면 전체가 하얗게 터졌다. 어두운 판 위에 네온만 띄운다. */
    /* ⚠ 예전엔 가운데가 30% 밖에 안 가려져 게이지와 큰 숫자가 그대로 비쳤다.
       «맨 앞에 안 나온다» 고 보이던 것이 이것이다. 어두운 판을 통째로 깔고
       그 «위에» 마젠타 발광을 얹는다 — 가림은 균일하게, 빛만 가운데로. */
    background:
      radial-gradient(circle, rgba(var(--glow),.30), transparent 62%),
      rgba(5,8,26,.95);
    font-size: 92px; color: #fff; font-weight: 800; letter-spacing: 8px;
    -webkit-text-stroke: 3px var(--magenta);
    paint-order: stroke fill;
    text-shadow: 0 0 5px rgba(var(--glow),1), 0 0 18px rgba(var(--glow),.8);
    animation: pop .5s ease-out;
    pointer-events: none;
    /* ⚠ 모든 요소보다 앞. z-index 가 없어 시안 안쪽 테두리(z-index 2) 뒤로
       깔려 있었다. 연출 자막은 무대에서 무엇에도 가리면 안 된다. */
    z-index: 50;
  }
  .verdict.show { display: flex; }
  .verdict.bad {
    background:
      radial-gradient(circle, rgba(255,92,92,.34), transparent 62%),
      rgba(10,4,10,.95);
    -webkit-text-stroke-color: var(--red);
    text-shadow: 0 0 5px rgba(255,92,92,1), 0 0 18px rgba(255,92,92,.85);
  }
  .verdict .sub { font-size: 16px; letter-spacing: 2px; color: var(--text-dim); font-weight: 400; text-shadow: none; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* 축포 — 100% 달성 순간. 조각은 JS가 만들고 Web Animations 로 날린다
     (조각마다 궤적이 달라야 해서 CSS 키프레임 하나로는 안 된다). */
  .confetti { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 60; }
  .confetti i { position: absolute; display: block; border-radius: 2px; will-change: transform, opacity; }

  .screen.shake { animation: shake .45s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-9px); } 40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(4px); }
  }

  /* ===== 폰 목업 ===== */
  .phone-side { width: 290px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .phone-side .cap { font-size: 11px; color: var(--text-faint); letter-spacing: 2px; }
  .phone {
    width: 270px; height: 560px;
    background: var(--surface); border: 8px solid var(--violet); border-radius: 34px;
    padding: 18px 14px; display: flex; flex-direction: column;
    box-shadow: 0 18px 50px rgba(0,0,0,.45), 0 0 34px rgba(var(--glow-violet),.5);
  }
  /* 상단(진행표시) · 본문(스크롤) · 하단(버튼) 3단.
     버튼을 본문에 두면 폰에서 키보드가 올라올 때 화면 밖으로 밀린다. */
  .ph-head { flex: 0 0 auto; }
  .ph-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .ph-foot { flex: 0 0 auto; }

  .ph-top { font-size: 10px; color: var(--text-faint); text-align: center; letter-spacing: 2px; margin-bottom: 12px; }
  .ph-bar { height: 3px; background: var(--line); border-radius: 2px; margin-bottom: 14px; overflow: hidden; }
  .ph-bar i { display: block; height: 100%; background: var(--gold); transition: width .3s; }
  .ph-q { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; line-height: 1.5; }
  .ph-d { font-size: 22px; color: var(--paper); font-weight: 700; margin-bottom: 18px; }
  /* 사투리로 바꿔야 할 부분. 대본이 «밑줄친 문장»이라고 지시하는 곳이다 —
     표시가 없으면 관객이 무엇을 바꿔 적어야 하는지 화면만 봐서는 모른다. */
  .ph-d u { color: var(--gold); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .ph-hint {
    font-size: 13px; color: var(--gold); letter-spacing: 3px;
    background: var(--surface-2); border: 1px dashed var(--line-2); border-radius: 8px;
    padding: 9px 12px; margin-bottom: 12px;
  }
  .ph-hint b { color: var(--text-dim); font-size: 11px; letter-spacing: 0; margin-right: 8px; }
  .ph-opts { display: flex; flex-direction: column; gap: 10px; }
  .ph-opt {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; font-size: 13px; color: var(--text); cursor: pointer; line-height: 1.4;
    transition: all .15s;
  }
  /* 터치 단말에서는 :hover 가 «눌린 채로» 남는다. 마우스가 있을 때만 건다. */
  @media (hover: hover) { .ph-opt:hover { border-color: var(--gold-dim); } }
  .ph-opt:active { transform: scale(.985); }
  .ph-opt.ok { background: var(--gold); color: var(--on-accent); border-color: var(--gold); font-weight: 700; }
  /* 오답 — 어두운 바탕이라 «연한 분홍 + 진한 빨강» 이 통째로 안 보인다.
     붉은 기를 머금은 어두운 면 위에 밝은 빨강 글자로 뒤집는다. */
  .ph-opt.no { background: #47142a; border-color: var(--red); color: #ff9a9a; }
  .ph-input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; font-size: 16px; color: var(--paper); font-family: inherit;
  }
  .ph-send {
    margin-top: 12px; width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: var(--gold); color: var(--on-accent); font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .ph-send:disabled { opacity: .35; cursor: default; }
  /* ===== 랜딩 — QR로 막 들어온 관객이 처음 보는 화면 =====
     그림이든 하단 버튼이든 누르면 시작한다. 엄지가 화면 어디에 있든
     걸리도록 두 군데를 다 열어 둔다. */
  .ph-landing { justify-content: center; align-items: stretch; }
  .ph-art {
    display: block; width: 100%; padding: 0; border: 0; background: none;
    border-radius: 16px; overflow: hidden; line-height: 0; cursor: pointer;
    min-height: 0; -webkit-tap-highlight-color: transparent;
  }
  .ph-art img { width: 100%; height: auto; max-height: 46vh; object-fit: contain; display: block; margin: 0 auto; }
  .ph-art:active { transform: scale(.99); }
  .ph-lead { text-align: center; color: var(--text-dim); line-height: 1.7; font-size: 13px; margin-top: 16px; }
  .ph-lead b { color: var(--gold); }

  .ph-done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; color: var(--text-dim); font-size: 13px; line-height: 1.7; }
  .ph-done .big { font-size: 34px; }
  .ph-warn { font-size: 10px; color: var(--text-faint); margin-top: 10px; line-height: 1.5; }

  /* ===== 문제 유형 구분 화면 (연습 / 객관식 / 주관식) =====
     화면에 이것뿐이라 가운데로 몰아 세운다. 네온 제목은 무대와 같은 규칙을
     따른다 — 흰 심 + 색 테두리(10-2). */
  .ph-sec { justify-content: center; align-items: center; text-align: center; gap: 18px; }
  .sec-title { font-size: 34px; letter-spacing: 4px; }
  .sec-lead { color: var(--text-dim); font-size: 14px; line-height: 1.9; }

  /* ===== 우리말 모으기 — 폰의 마지막 화면 ===== */
  .wd-lead {
    color: var(--text-dim); font-size: 14px; line-height: 1.85;
    background: var(--surface-2); border: 1px dashed var(--line-2); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px;
  }
  .wd-lead b { color: var(--gold); }
  .wd-lead span { font-size: .85em; color: var(--text-faint); }
  .wd-sent { display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; }
  .sw-cap { width: 100%; font-size: 11px; color: var(--text-faint); margin-bottom: 2px; }
  /* 보낸 말은 골드로 굳는다 — «내 말이 무대로 갔다» 는 표시 */
  .wd-chip {
    font-size: 12px; padding: 5px 9px; border-radius: 999px;
    background: var(--gold); color: var(--on-accent); font-weight: 700;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* 입력칸과 버튼이 하단에 나란히 — 키보드가 올라와도 밀리지 않는다 */
  .ph-foot .ph-input { margin-bottom: 8px; }

  /* ===== 무대 스크린 모드 (/ — 진행자) =====
     관객은 각자 폰으로 들어오므로 무대에 폰 목업을 띄울 이유가 없다. */
  body.stage .phone-side { display: none; }


  /* 진행자 조작 바 — 프로젝션 밖(화면 맨 아래)에 두고 H로 숨긴다 */
  #opbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: none; gap: 18px; align-items: center; flex-wrap: wrap;
    background: rgba(7,12,34,.94); border-top: 1px solid var(--line);
    color: var(--text); font-size: 13px; padding: 7px 14px; line-height: 1.6;
  }
  body.stage #opbar { display: flex; }
  #opbar.off { display: none; }
  #opbar b { color: var(--gold); }
  #opbar b.ok { color: var(--green); }
  #opbar b.warn { color: var(--red); }
  #opbar .k { color: var(--text-faint); margin-left: auto; }

  /* ===== Q-Studio 임베드 모드 (출력창 iframe · 1920×1080) =====
     프로젝터에는 가장자리까지 꽉 차야 한다. 데모용 카드 테두리·바깥 여백·
     «STAGE SCREEN» 라벨은 무대에 나갈 것이 아니다.
     진행자 바도 여기서는 감춘다 — 출력 화면에는 콘텐츠 말고 아무것도 그리지 않는다. */
  body.embed { padding: 0; height: 100vh; min-height: 100vh; }
  body.embed .wrap { max-width: none; height: 100%; gap: 0; }
  body.embed .screen {
    border: 0; border-radius: 0; box-shadow: none;
    min-height: 0; height: 100%; padding: 3.2vh 4vw; cursor: default;
  }
  body.embed .screen-label { display: none; }
  body.embed #opbar { display: none; }

  /* 무대 글씨·기둥을 화면 «높이» 기준으로 잡는다. px 로 두면 프로젝터
     해상도가 1024든 1920이든 같은 픽셀이라, 해상도가 높을수록 상대적으로
     작아진다. vh 로 두면 4:3이든 16:9든 화면에서 차지하는 비율이 같다.
     (극장 스크린은 4:3 — 세로가 넉넉해 기둥이 길게 선다) */
  body.embed .title { font-size: 2.1vh; }
  body.embed .counter,
  body.embed .join-num { font-size: 2.4vh; }
  body.embed .join-num b { font-size: 4.4vh; }
  body.embed .join { gap: 3vh; margin: 4vh 0 3.4vh; }
  body.embed .pct { font-size: 12vh; }
  body.embed .pct-unit { font-size: 4.2vh; padding-bottom: 1.2vh; }
  body.embed .pct-cap { font-size: 4vh; margin-bottom: 2.2vh; }
  body.embed .gauge-bar { width: 11vh; flex: 0 0 11vh; }
  body.embed .gauge-scale { font-size: 1.6vh; right: calc(50% + 5.5vh + 1.6vh); }
  body.embed .gauge-legend { font-size: 2vh; }
  body.embed .bubble { font-size: 2vh; }
  body.embed .bubble.word { font-size: 2.6vh; padding: .7vh 1.6vh; }
  /* 로비·연출 글자도 화면 높이 기준으로. 극장 스크린은 4:3 이라 세로가
     넉넉하고, 그만큼 제목이 크게 선다. px 로 두면 1024×768 에서는 커 보이고
     1920×1440 에서는 작아 보인다. */
  body.embed .lobby h1 { font-size: 7vh; }
  body.embed .lobby h1.title-big { font-size: 12vh; }
  body.embed .title-sub { font-size: 3.4vh; letter-spacing: .8vh; }
  body.embed .lobby p { font-size: 2.6vh; }
  body.embed .qr-url { font-size: 2vh; }
  body.embed .qr-box { padding: 1.6vh; }
  body.embed .hint { font-size: 2vh; }
  body.embed .verdict { font-size: 9vh; }
  body.embed .verdict .sub { font-size: 2.6vh; }
  /* 5키 «경고» — 깜박인다. 음성이 흐르는 9.7초 동안 계속 뜬 채로 있어야 하는데,
     가만히 떠 있으면 «화면이 멈췄나» 로 읽힌다. 켜졌다 꺼지는 간판처럼 만든다.
     ⚠ 완전히 사라지게(opacity 0) 하면 글자가 읽히지 않는 순간이 생긴다.
       바닥을 .25 로 두어 «흐려졌다 밝아지는» 정도로만 둔다. */
  .verdict.warn-blink { animation: warnblink .62s steps(1, end) infinite; }
  @keyframes warnblink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: .25; } }
  body.embed .done h1 { font-size: 7vh; }
  /* 네온 관도 화면에 맞춰 굵어져야 한다 — 고정 2px 은 큰 화면에서 실처럼 얇다 */
  body.embed .neon { -webkit-text-stroke-width: .28vh; }
  body.embed .screen { border-width: .34vh; }
  body.embed .screen::after { inset: 1.4vh; border-width: .24vh; }

  /* ===== 폰 전용 모드 (?p=1 — QR로 들어온 관객) =====
     관객에게는 무대 스크린을 보여주지 않는다. 각자의 폰에 각자의 게이지가
     따로 뜨면 무대 화면과 숫자가 서로 다르게 놀기 때문이다. */
  /* 문서 전체를 뷰포트에 고정한다. 스크롤은 본문(.ph-body)만 한다 —
     페이지가 통째로 스크롤되면 하단 버튼이 따라 올라가 «고정»이 무너진다. */
  body.phone-only {
    padding: 0; justify-content: flex-start;
    height: 100vh; height: 100dvh; min-height: 0; overflow: hidden;
  }
  body.phone-only .wrap,
  body.phone-only .phone-side { height: 100%; }
  body.phone-only .screen,
  body.phone-only .phone-side > .cap,
  body.phone-only .phone-side > .ph-warn { display: none; }
  body.phone-only .wrap { max-width: 520px; gap: 0; }
  body.phone-only .phone-side { width: 100%; gap: 0; }
  /* 화면을 꽉 채운다. dvh 는 주소창이 접혔다 펴져도 높이가 흔들리지 않는다
     (vh 만 쓰면 하단 버튼이 브라우저 UI에 잘린다). 모르는 브라우저는 vh 로 떨어진다. */
  body.phone-only .phone {
    width: 100%; height: 100vh; height: 100dvh; min-height: 0;
    border: none; border-radius: 0; box-shadow: none;
    padding: 0;
  }
  body.phone-only .ph-head {
    padding: calc(14px + env(safe-area-inset-top)) 20px 12px;
    border-bottom: 1px solid var(--line);
  }
  body.phone-only .ph-body { padding: 22px 20px 26px; }
  /* 하단 버튼 — 엄지가 닿는 자리에 고정한다. 홈 인디케이터를 피해 여백을 준다. */
  body.phone-only .ph-foot {
    padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--surface);
  }

  /* 어두운 객석에서 서서 한 손으로 본다는 전제로 키운다 */
  body.phone-only .ph-top { font-size: 12px; letter-spacing: 1px; margin-bottom: 10px; }
  body.phone-only .ph-bar { height: 4px; margin-bottom: 0; }
  body.phone-only .ph-q { font-size: 15px; margin-bottom: 8px; }
  body.phone-only .ph-d { font-size: 27px; line-height: 1.45; margin-bottom: 22px; }
  body.phone-only .ph-hint { font-size: 20px; letter-spacing: 7px; padding: 14px 16px; margin-bottom: 20px; }
  body.phone-only .ph-hint b { font-size: 12px; letter-spacing: 0; }
  body.phone-only .ph-opts { gap: 12px; }
  /* 손가락으로 누른다 — 최소 58px. 44px 이하는 오터치가 난다. */
  body.phone-only .ph-opt { padding: 17px 16px; font-size: 17px; border-radius: 14px; min-height: 58px; }
  body.phone-only .ph-input { font-size: 18px; padding: 17px; border-radius: 14px; }
  body.phone-only .ph-send { font-size: 18px; padding: 18px; border-radius: 14px; margin-top: 0; }

/* ── Supabase REST 호출 ───────────────────────────────────
   실시간 구독(WebSocket) 대신 1초 폴링을 쓴다. 공연은 단 한 번뿐이라
   이벤트 유실 시 게이지가 영구히 틀어지는 것보다, 매번 전체를 다시 읽어
   스스로 복구되는 편이 안전하다. 무대 게이지에 1초 지연은 보이지 않는다. */
async function db(path, opts = {}) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    ...opts,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) throw new Error(path + " → " + res.status + " " + (await res.text()).slice(0, 120));
  return res;
}

const PANES = ["title", "lobby", "stage", "words", "done"];
let paneTimer = null;
function showPane(id) {
  clearTimeout(paneTimer);
  const leaving = PANES.filter(p => $(p) && $(p).style.display !== "none" && p !== id);
  leaving.forEach(p => { $(p).style.opacity = "0"; });
  const raise = () => {
    PANES.forEach(p => { const el = $(p); if (el && p !== id) el.style.display = "none"; });
    const el = $(id);
    if (!el) return;
    el.style.opacity = "0";
    el.style.display = "flex";
    requestAnimationFrame(() => { el.style.opacity = "1"; });
  };
  if (leaving.length) paneTimer = setTimeout(raise, 230);
  else raise();
}
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
